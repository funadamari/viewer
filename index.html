<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=5.0,
               user-scalable=no">

<title>画像ビューア</title>


<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family: sans-serif;

}


#viewer {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;

}


#image {

    position: absolute;

    left: 0;
    top: 0;

    max-width: none;
    max-height: none;

    transform-origin: 0 0;

    user-select: none;

    -webkit-user-drag: none;

    touch-action: none;

}


#title {

    position: fixed;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    max-width: 90%;

    padding: 8px 14px;

    background:
        rgba(0, 0, 0, 0.65);

    border-radius: 5px;

    font-size: 15px;

    line-height: 1.4;

    text-align: center;

    box-sizing: border-box;

    pointer-events: none;

    z-index: 20;

}


#controls {

    position: fixed;

    right: 15px;
    bottom: 15px;

    display: flex;

    gap: 8px;

    z-index: 30;

}


.controlButton {

    width: 42px;
    height: 42px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background:
        rgba(50, 50, 50, 0.75);

    color: #fff;

    font-size: 22px;

    line-height: 42px;

    text-align: center;

    cursor: pointer;

    user-select: none;

    -webkit-user-select: none;

}


.controlButton:hover {

    background:
        rgba(90, 90, 90, 0.9);

}


#closeButton {

    font-size: 24px;

}


#loading {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    color: #fff;

    font-size: 16px;

    z-index: 10;

}


</style>

</head>


<body>


<div id="viewer">

    <div id="loading">
        読み込み中…
    </div>

    <img
        id="image"
        draggable="false"
        alt=""
    >

</div>


<div id="title"></div>


<div id="controls">

    <button
        id="zoomOut"
        class="controlButton"
        type="button"
        aria-label="縮小">
        −
    </button>

    <button
        id="zoomIn"
        class="controlButton"
        type="button"
        aria-label="拡大">
        ＋
    </button>

    <button
        id="resetButton"
        class="controlButton"
        type="button"
        aria-label="リセット">
        ↺
    </button>

    <button
        id="closeButton"
        class="controlButton"
        type="button"
        aria-label="閉じる">
        ×
    </button>

</div>


<script>


/* =========================================================
   設定
========================================================= */


const INITIAL_SCALE = 0.90;

const MIN_SCALE = 0.40;

const MAX_SCALE = 5.00;

const ZOOM_STEP = 1.20;

const DOUBLE_TAP_SCALE = 2.00;

const DOUBLE_TAP_TIME = 350;

const DOUBLE_TAP_DISTANCE = 30;

const TAP_MOVE_THRESHOLD = 12;


/*
   launcherとの画像情報共有
*/

const VIEWER_STORAGE_KEY =
    "funadamariViewerRequest";


/*
   現在表示中のviewer情報
*/

const ACTIVE_VIEWER_KEY =
    "funadamariActiveViewer";


/*
   古いviewer requestを無視するための時間
*/

const REQUEST_VALID_TIME =
    30 * 1000;


/* =========================================================
   URLパラメータ
========================================================= */


const params =
    new URLSearchParams(
        window.location.search
    );


let initialImageURL =
    params.get("image") || "";


let initialTitle =
    params.get("title") || "";



/* =========================================================
   HTML要素
========================================================= */


const viewer =
    document.getElementById(
        "viewer"
    );


const image =
    document.getElementById(
        "image"
    );


const titleElement =
    document.getElementById(
        "title"
    );


const loading =
    document.getElementById(
        "loading"
    );


const zoomInButton =
    document.getElementById(
        "zoomIn"
    );


const zoomOutButton =
    document.getElementById(
        "zoomOut"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


const closeButton =
    document.getElementById(
        "closeButton"
    );



/* =========================================================
   Viewer ID
========================================================= */


/*
   sessionStorageに保存しておくことで、
   同じviewerタブでは同じIDを使用する。

   別タブでは別IDになる。
*/

let VIEWER_ID =
    sessionStorage.getItem(
        "funadamariViewerId"
    );


if (!VIEWER_ID) {

    VIEWER_ID =
        "viewer-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2);


    sessionStorage.setItem(
        "funadamariViewerId",
        VIEWER_ID
    );

}



/* =========================================================
   viewerの状態
========================================================= */


let fitScale = 1;

let scale = INITIAL_SCALE;

let translateX = 0;

let translateY = 0;


/*
   画像の実際の表示倍率

   fitScale × scale
*/

function getActualScale() {

    return fitScale * scale;

}


/* =========================================================
   pointer / touch状態
========================================================= */


const pointers =
    new Map();


let isDragging = false;

let dragLastX = 0;

let dragLastY = 0;


/*
   pinch開始時の情報
*/

let pinchStartDistance = 0;

let pinchStartScale = 1;

let pinchCenterX = 0;

let pinchCenterY = 0;


/*
   タップ判定
*/

let tapStartX = 0;

let tapStartY = 0;

let tapMoved = false;

let lastTapTime = 0;

let lastTapX = 0;

let lastTapY = 0;



/* =========================================================
   画像の表示位置制限
========================================================= */


function clampTranslation() {

    const actualScale =
        getActualScale();


    const imageWidth =
        image.naturalWidth *
        actualScale;


    const imageHeight =
        image.naturalHeight *
        actualScale;


    const viewportWidth =
        viewer.clientWidth;


    const viewportHeight =
        viewer.clientHeight;


    /*
       横方向
    */

    if (imageWidth <= viewportWidth) {

        translateX =
            (viewportWidth -
             imageWidth) / 2;

    }
    else {

        const minX =
            viewportWidth -
            imageWidth;


        const maxX = 0;


        if (translateX < minX) {

            translateX = minX;

        }


        if (translateX > maxX) {

            translateX = maxX;

        }

    }


    /*
       縦方向
    */

    if (imageHeight <= viewportHeight) {

        translateY =
            (viewportHeight -
             imageHeight) / 2;

    }
    else {

        const minY =
            viewportHeight -
            imageHeight;


        const maxY = 0;


        if (translateY < minY) {

            translateY = minY;

        }


        if (translateY > maxY) {

            translateY = maxY;

        }

    }

}



/* =========================================================
   transform適用
========================================================= */


function applyTransform() {

    clampTranslation();


    image.style.transform =
        "translate(" +
        translateX +
        "px, " +
        translateY +
        "px) " +
        "scale(" +
        getActualScale() +
        ")";

}



/* =========================================================
   fitScale計算
========================================================= */


function calculateFitScale() {

    if (!image.naturalWidth ||
        !image.naturalHeight) {

        return 1;

    }


    let viewportWidth =
        viewer.clientWidth;


    let viewportHeight =
        viewer.clientHeight;


    /*
       visualViewportが使用可能なら
       そのサイズを利用する。

       スマートフォンの
       アドレスバー等によるviewport変化に対応。
    */

    if (window.visualViewport) {

        viewportWidth =
            window.visualViewport.width;

        viewportHeight =
            window.visualViewport.height;

    }


    const widthScale =
        viewportWidth /
        image.naturalWidth;


    const heightScale =
        viewportHeight /
        image.naturalHeight;


    return Math.min(
        widthScale,
        heightScale
    );

}



/* =========================================================
   初期表示
========================================================= */


function resetView() {

    fitScale =
        calculateFitScale();


    scale =
        INITIAL_SCALE;


    translateX = 0;

    translateY = 0;


    applyTransform();

}



/* =========================================================
   scale変更
========================================================= */


function setScale(
    newScale,
    centerX,
    centerY
) {

    const oldActualScale =
        getActualScale();


    const newRelativeScale =
        Math.max(
            MIN_SCALE,
            Math.min(
                MAX_SCALE,
                newScale
            )
        );


    const newActualScale =
        fitScale *
        newRelativeScale;


    /*
       zoom中心が同じ位置に残るように
       translationを調整する。
    */

    const imageX =
        (centerX -
         translateX) /
        oldActualScale;


    const imageY =
        (centerY -
         translateY) /
        oldActualScale;


    translateX =
        centerX -
        imageX *
        newActualScale;


    translateY =
        centerY -
        imageY *
        newActualScale;


    scale =
        newRelativeScale;


    applyTransform();

}



/* =========================================================
   zoom
========================================================= */


function zoomIn(
    centerX,
    centerY
) {

    if (
        typeof centerX !== "number"
    ) {

        centerX =
            viewer.clientWidth / 2;

    }


    if (
        typeof centerY !== "number"
    ) {

        centerY =
            viewer.clientHeight / 2;

    }


    setScale(
        scale * ZOOM_STEP,
        centerX,
        centerY
    );

}



function zoomOut(
    centerX,
    centerY
) {

    if (
        typeof centerX !== "number"
    ) {

        centerX =
            viewer.clientWidth / 2;

    }


    if (
        typeof centerY !== "number"
    ) {

        centerY =
            viewer.clientHeight / 2;

    }


    setScale(
        scale / ZOOM_STEP,
        centerX,
        centerY
    );

}



/* =========================================================
   画像読み込み
========================================================= */


function loadImage(
    imageURL,
    imageTitle
) {

    if (!imageURL) {

        loading.textContent =
            "画像URLが指定されていません。";

        return;

    }


    loading.style.display =
        "block";


    image.style.display =
        "none";


    const newImage =
        new Image();


    newImage.onload =
        function () {

            image.src =
                imageURL;


            image.alt =
                imageTitle || "";


            titleElement.textContent =
                imageTitle || "";


            loading.style.display =
                "none";


            image.style.display =
                "block";


            /*
               新しい画像を表示するときは
               90% fitから開始
            */

            resetView();

        };


    newImage.onerror =
        function () {

            loading.textContent =
                "画像を読み込めませんでした。";

            image.style.display =
                "none";

        };


    newImage.src =
        imageURL;

}



/* =========================================================
   active viewer登録
========================================================= */


function registerAsActiveViewer() {

    try {

        localStorage.setItem(

            ACTIVE_VIEWER_KEY,

            JSON.stringify({

                id:
                    VIEWER_ID,

                timestamp:
                    Date.now()

            })

        );

    }
    catch (error) {

        console.error(
            "active viewer registration error:",
            error
        );

    }

}



/* =========================================================
   active viewer解除
========================================================= */


function unregisterActiveViewer() {

    try {

        const raw =
            localStorage.getItem(
                ACTIVE_VIEWER_KEY
            );


        if (!raw) {

            return;

        }


        const info =
            JSON.parse(raw);


        if (
            info &&
            info.id === VIEWER_ID
        ) {

            localStorage.removeItem(
                ACTIVE_VIEWER_KEY
            );

        }

    }
    catch (error) {

        console.error(
            "active viewer unregister error:",
            error
        );

    }

}



/* =========================================================
   active viewer判定
========================================================= */


function isActiveViewer() {

    try {

        const raw =
            localStorage.getItem(
                ACTIVE_VIEWER_KEY
            );


        if (!raw) {

            return false;

        }


        const info =
            JSON.parse(raw);


        if (!info ||
            info.id !== VIEWER_ID) {

            return false;

        }


        /*
           あまりに古いactive情報は
           無効とする。
        */

        if (info.timestamp) {

            const age =
                Date.now() -
                Number(info.timestamp);


            if (
                age >
                REQUEST_VALID_TIME
            ) {

                return false;

            }

        }


        return true;

    }
    catch (error) {

        return false;

    }

}



/* =========================================================
   launcherからの画像変更要求を確認
========================================================= */


function checkViewerRequest() {

    const raw =
        localStorage.getItem(
            VIEWER_STORAGE_KEY
        );


    if (!raw) {

        return;

    }


    let request;


    try {

        request =
            JSON.parse(raw);

    }
    catch (error) {

        return;

    }


    if (!request) {

        return;

    }


    /*
       古い要求は無視
    */

    if (request.timestamp) {

        const age =
            Date.now() -
            Number(request.timestamp);


        if (
            age >
            REQUEST_VALID_TIME
        ) {

            return;

        }

    }


    /*
       自分宛ての要求でなければ無視
    */

    if (
        request.targetViewerId !==
        VIEWER_ID
    ) {

        return;

    }


    /*
       自分がactive viewerでなければ無視
    */

    if (
        !isActiveViewer()
    ) {

        return;

    }


    /*
       画像を変更
    */

    loadImage(
        request.image,
        request.title
    );


    /*
       ★今回追加した処理

       既存viewerを再利用した場合、
       viewerタブを前面にする。

       Google Sitesから2枚目以降の
       画像をクリックした場合に、
       Google Sites側にフォーカスが
       戻ってしまう問題への対応。
    */

    try {

        window.focus();

    }
    catch (error) {

        console.warn(
            "viewer focus failed:",
            error
        );

    }

}



/* =========================================================
   storage event
========================================================= */


/*
   localStorageの変更は、
   変更を行った自分自身のwindowには
   storage eventが発生しない。

   launcherが書き込み、
   viewerが受け取る構造なので、
   ここで処理する。
*/

window.addEventListener(
    "storage",
    function (event) {

        if (
            event.key ===
            VIEWER_STORAGE_KEY
        ) {

            checkViewerRequest();

        }


        /*
           active viewer情報が変更された場合も
           必要に応じて確認する。
        */

        if (
            event.key ===
            ACTIVE_VIEWER_KEY
        ) {

            checkViewerRequest();

        }

    }
);



/* =========================================================
   pointerdown
========================================================= */


viewer.addEventListener(
    "pointerdown",
    function (event) {

        /*
           controls上の操作は
           viewer側pointer処理から除外。
        */

        if (
            event.target.closest(
                "#controls"
            )
        ) {

            return;

        }


        viewer.setPointerCapture(
            event.pointerId
        );


        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );


        tapStartX =
            event.clientX;


        tapStartY =
            event.clientY;


        tapMoved =
            false;


        if (
            pointers.size === 1
        ) {

            /*
               1本指ドラッグ開始
            */

            isDragging =
                true;


            dragLastX =
                event.clientX;


            dragLastY =
                event.clientY;

        }


        if (
            pointers.size === 2
        ) {

            /*
               pinch開始
            */

            isDragging =
                false;


            const values =
                Array.from(
                    pointers.values()
                );


            const p1 =
                values[0];


            const p2 =
                values[1];


            pinchStartDistance =
                Math.hypot(
                    p2.x - p1.x,
                    p2.y - p1.y
                );


            pinchStartScale =
                scale;


            pinchCenterX =
                (p1.x + p2.x) / 2;


            pinchCenterY =
                (p1.y + p2.y) / 2;

        }

    }
);



/* =========================================================
   pointermove
========================================================= */


viewer.addEventListener(
    "pointermove",
    function (event) {

        if (
            !pointers.has(
                event.pointerId
            )
        ) {

            return;

        }


        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );


        /*
           1本指ドラッグ
        */

        if (
            pointers.size === 1 &&
            isDragging
        ) {

            const dx =
                event.clientX -
                dragLastX;


            const dy =
                event.clientY -
                dragLastY;


            if (
                Math.abs(
                    event.clientX -
                    tapStartX
                ) >
                TAP_MOVE_THRESHOLD ||
                Math.abs(
                    event.clientY -
                    tapStartY
                ) >
                TAP_MOVE_THRESHOLD
            ) {

                tapMoved =
                    true;

            }


            translateX +=
                dx;


            translateY +=
                dy;


            dragLastX =
                event.clientX;


            dragLastY =
                event.clientY;


            applyTransform();

        }


        /*
           2本指pinch
        */

        if (
            pointers.size === 2
        ) {

            const values =
                Array.from(
                    pointers.values()
                );


            const p1 =
                values[0];


            const p2 =
                values[1];


            const distance =
                Math.hypot(
                    p2.x - p1.x,
                    p2.y - p1.y
                );


            const centerX =
                (p1.x + p2.x) / 2;


            const centerY =
                (p1.y + p2.y) / 2;


            if (
                pinchStartDistance > 0
            ) {

                const ratio =
                    distance /
                    pinchStartDistance;


                const newScale =
                    pinchStartScale *
                    ratio;


                setScale(
                    newScale,
                    centerX,
                    centerY
                );

            }


            /*
               pinch中はタップではない
            */

            tapMoved =
                true;

        }

    }
);



/* =========================================================
   pointerup
========================================================= */


viewer.addEventListener(
    "pointerup",
    function (event) {

        /*
           残っているpointerを
           取得する前に削除
        */

        pointers.delete(
            event.pointerId
        );


        /*
           pinch終了後に
           1本指が残っている場合
        */

        if (
            pointers.size === 1
        ) {

            const remaining =
                Array.from(
                    pointers.values()
                )[0];


            /*
               ★重要

               pinchから1本指dragへ移行した際、
               前回の座標との差による
               「ジャンプ」を防止する。

               残った指の現在位置を
               drag基準点にする。
            */

            dragLastX =
                remaining.x;


            dragLastY =
                remaining.y;


            isDragging =
                true;


            tapMoved =
                true;


            return;

        }


        /*
           pointerが0本
        */

        if (
            pointers.size === 0
        ) {

            isDragging =
                false;

        }


        /*
           タップ判定
        */

        if (!tapMoved) {

            const now =
                Date.now();


            const distance =
                Math.hypot(
                    event.clientX -
                    lastTapX,
                    event.clientY -
                    lastTapY
                );


            if (
                now -
                lastTapTime <
                DOUBLE_TAP_TIME &&
                distance <
                DOUBLE_TAP_DISTANCE
            ) {

                /*
                   double tap
                */

                if (
                    Math.abs(
                        scale -
                        DOUBLE_TAP_SCALE
                    ) <
                    0.01
                ) {

                    /*
                       200% → 90%
                    */

                    setScale(
                        INITIAL_SCALE,
                        event.clientX,
                        event.clientY
                    );

                }
                else {

                    /*
                       90% → 200%
                    */

                    setScale(
                        DOUBLE_TAP_SCALE,
                        event.clientX,
                        event.clientY
                    );

                }


                lastTapTime =
                    0;

            }
            else {

                lastTapTime =
                    now;


                lastTapX =
                    event.clientX;


                lastTapY =
                    event.clientY;

            }

        }

    }
);



/* =========================================================
   pointercancel
========================================================= */


viewer.addEventListener(
    "pointercancel",
    function (event) {

        pointers.delete(
            event.pointerId
        );


        if (
            pointers.size === 0
        ) {

            isDragging =
                false;

        }

    }
);



/* =========================================================
   PC double click
========================================================= */


viewer.addEventListener(
    "dblclick",
    function (event) {

        /*
           controls上では実行しない
        */

        if (
            event.target.closest(
                "#controls"
            )
        ) {

            return;

        }


        if (
            Math.abs(
                scale -
                DOUBLE_TAP_SCALE
            ) <
            0.01
        ) {

            setScale(
                INITIAL_SCALE,
                event.clientX,
                event.clientY
            );

        }
        else {

            setScale(
                DOUBLE_TAP_SCALE,
                event.clientX,
                event.clientY
            );

        }

    }
);



/* =========================================================
   PC mouse wheel
========================================================= */


viewer.addEventListener(
    "wheel",
    function (event) {

        event.preventDefault();


        if (
            event.deltaY < 0
        ) {

            zoomIn(
                event.clientX,
                event.clientY
            );

        }
        else {

            zoomOut(
                event.clientX,
                event.clientY
            );

        }

    },
    {
        passive: false
    }
);



/* =========================================================
   zoom buttons
========================================================= */


zoomInButton.addEventListener(
    "click",
    function () {

        zoomIn();

    }
);


zoomOutButton.addEventListener(
    "click",
    function () {

        zoomOut();

    }
);


resetButton.addEventListener(
    "click",
    function () {

        resetView();

    }
);



/* =========================================================
   close button
========================================================= */


closeButton.addEventListener(
    "click",
    function () {

        unregisterActiveViewer();


        try {

            window.close();

        }
        catch (error) {

            // ignore

        }

    }
);



/* =========================================================
   viewport変更
========================================================= */


function handleViewportChange() {

    /*
       現在の画像の表示位置を
       できるだけ維持する。

       ただしfitScaleはviewport変更に
       合わせて再計算する。
    */

    if (!image.naturalWidth) {

        return;

    }


    const oldFitScale =
        fitScale;


    const oldActualScale =
        oldFitScale *
        scale;


    fitScale =
        calculateFitScale();


    const newActualScale =
        fitScale *
        scale;


    /*
       viewport中央を基準に
       表示位置を調整
    */

    const oldCenterX =
        viewer.clientWidth / 2;


    const oldCenterY =
        viewer.clientHeight / 2;


    const imageCenterX =
        (oldCenterX -
         translateX) /
        oldActualScale;


    const imageCenterY =
        (oldCenterY -
         translateY) /
        oldActualScale;


    translateX =
        oldCenterX -
        imageCenterX *
        newActualScale;


    translateY =
        oldCenterY -
        imageCenterY *
        newActualScale;


    applyTransform();

}



window.addEventListener(
    "resize",
    handleViewportChange
);


if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        handleViewportChange
    );

}



/* =========================================================
   visibilitychange
========================================================= */


/*
   viewerが再び表示された場合、
   自分をactive viewerとして登録する。
*/

document.addEventListener(
    "visibilitychange",
    function () {

        if (
            document.visibilityState ===
            "visible"
        ) {

            registerAsActiveViewer();

        }

    }
);



/* =========================================================
   pagehide
========================================================= */


window.addEventListener(
    "pagehide",
    function () {

        unregisterActiveViewer();

    }
);



/* =========================================================
   contextmenu禁止
========================================================= */


viewer.addEventListener(
    "contextmenu",
    function (event) {

        event.preventDefault();

    }
);



/* =========================================================
   初期化
========================================================= */


/*
   viewerをactiveとして登録
*/

registerAsActiveViewer();


/*
   window.nameを設定

   launcherなどからviewerを識別するときに
   利用できるようにする。
*/

try {

    window.name =
        "funadamariViewer";

}
catch (error) {

    // ignore

}


/*
   URLから最初の画像を読み込む
*/

if (initialImageURL) {

    loadImage(
        initialImageURL,
        initialTitle
    );

}
else {

    loading.textContent =
        "画像URLが指定されていません。";

}


/*
   念のため、すでにlocalStorageに
   自分宛ての要求があれば確認する。
*/

setTimeout(
    function () {

        checkViewerRequest();

    },
    100
);


</script>
