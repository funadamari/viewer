<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=5.0,
               user-scalable=no">

<title>画像ビューア</title>


<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family: sans-serif;

}


#viewer {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;

}


#image {

    position: absolute;

    left: 0;
    top: 0;

    max-width: none;
    max-height: none;

    transform-origin: 0 0;

    user-select: none;

    -webkit-user-drag: none;

    touch-action: none;

}


#title {

    position: fixed;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    max-width: 90%;

    padding: 8px 14px;

    background:
        rgba(0, 0, 0, 0.65);

    border-radius: 5px;

    font-size: 15px;

    line-height: 1.4;

    text-align: center;

    box-sizing: border-box;

    pointer-events: none;

    z-index: 20;

}


#controls {

    position: fixed;

    right: 15px;
    bottom: 15px;

    display: flex;

    gap: 8px;

    z-index: 30;

}


.controlButton {

    width: 42px;
    height: 42px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background:
        rgba(50, 50, 50, 0.75);

    color: #fff;

    font-size: 22px;

    line-height: 42px;

    text-align: center;

    cursor: pointer;

    user-select: none;

    -webkit-user-select: none;

}


.controlButton:hover {

    background:
        rgba(90, 90, 90, 0.9);

}


#closeButton {

    font-size: 24px;

}


#loading {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    color: #fff;

    font-size: 16px;

    z-index: 10;

}

</style>

</head>


<body>


<div id="viewer">

    <div id="loading">
        読み込み中…
    </div>

    <img
        id="image"
        draggable="false"
        alt=""
    >

</div>


<div id="title"></div>


<div id="controls">

    <button
        id="zoomOut"
        class="controlButton"
        type="button">
        −
    </button>

    <button
        id="zoomIn"
        class="controlButton"
        type="button">
        ＋
    </button>

    <button
        id="resetButton"
        class="controlButton"
        type="button">
        ↺
    </button>

    <button
        id="closeButton"
        class="controlButton"
        type="button">
        ×
    </button>

</div>


<script>


/* =========================================================
   設定
========================================================= */

const INITIAL_SCALE = 0.90;

const MIN_SCALE = 0.40;

const MAX_SCALE = 5.00;

const ZOOM_STEP = 1.20;

const DOUBLE_TAP_SCALE = 2.00;

const DOUBLE_TAP_TIME = 350;

const DOUBLE_TAP_DISTANCE = 30;

const TAP_MOVE_THRESHOLD = 12;

const REQUEST_VALID_TIME =
    30 * 1000;
      
/*
   launcherとの通信
*/

const VIEWER_STORAGE_KEY =
    "funadamariViewerRequest";

/* =========================================================
   Service Worker
   launcherからの画像変更要求を受け取る
========================================================= */

if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register(
        "/sw.js",
        {
            scope: "/"
        }
    )
    .then(function (registration) {

        console.log(
            "Service Worker registered:",
            registration.scope
        );

    })
    .catch(function (error) {

        console.error(
            "Service Worker registration failed:",
            error
        );

    });

      
const ACTIVE_VIEWER_KEY =
    "funadamariActiveViewer";


/*
   viewerの名前

   launcherと共通にする。
*/

const VIEWER_WINDOW_NAME =
    "funadamariViewer";


/* =========================================================
   URLパラメータ
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


let initialImageURL =
    params.get("image") || "";


let initialTitle =
    params.get("title") || "";


/* =========================================================
   HTML
========================================================= */

const viewer =
    document.getElementById("viewer");

const image =
    document.getElementById("image");

const titleElement =
    document.getElementById("title");

const loading =
    document.getElementById("loading");

const zoomInButton =
    document.getElementById("zoomIn");

const zoomOutButton =
    document.getElementById("zoomOut");

const resetButton =
    document.getElementById("resetButton");

const closeButton =
    document.getElementById("closeButton");


/* =========================================================
   Viewer ID
========================================================= */

let VIEWER_ID =
    sessionStorage.getItem(
        "funadamariViewerId"
    );


if (!VIEWER_ID) {

    VIEWER_ID =
        "viewer-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2);


    sessionStorage.setItem(
        "funadamariViewerId",
        VIEWER_ID
    );

}


/* =========================================================
   Window name
========================================================= */

try {

    /*
       このviewerは常にこの名前を持つ。

       launcherが同じ名前を指定した場合、
       このwindowを再利用できるようにする。
    */

    window.name =
        VIEWER_WINDOW_NAME;

}
catch (error) {

    // ignore

}


/* =========================================================
   表示状態
========================================================= */

let fitScale = 1;

let scale = INITIAL_SCALE;

let translateX = 0;

let translateY = 0;


function getActualScale() {

    return fitScale * scale;

}


/* =========================================================
   Pointer状態
========================================================= */

const pointers =
    new Map();


let isDragging = false;

let dragLastX = 0;

let dragLastY = 0;


let pinchStartDistance = 0;

let pinchStartScale = 1;

let pinchCenterX = 0;

let pinchCenterY = 0;


let tapStartX = 0;

let tapStartY = 0;

let tapMoved = false;


let lastTapTime = 0;

let lastTapX = 0;

let lastTapY = 0;


/* =========================================================
   translation制限
========================================================= */

function clampTranslation() {

    const actualScale =
        getActualScale();


    const imageWidth =
        image.naturalWidth *
        actualScale;


    const imageHeight =
        image.naturalHeight *
        actualScale;


    const viewportWidth =
        viewer.clientWidth;


    const viewportHeight =
        viewer.clientHeight;


    if (
        imageWidth <=
        viewportWidth
    ) {

        translateX =
            (
                viewportWidth -
                imageWidth
            ) / 2;

    }
    else {

        const minX =
            viewportWidth -
            imageWidth;


        if (
            translateX < minX
        ) {

            translateX =
                minX;

        }


        if (
            translateX > 0
        ) {

            translateX = 0;

        }

    }


    if (
        imageHeight <=
        viewportHeight
    ) {

        translateY =
            (
                viewportHeight -
                imageHeight
            ) / 2;

    }
    else {

        const minY =
            viewportHeight -
            imageHeight;


        if (
            translateY < minY
        ) {

            translateY =
                minY;

        }


        if (
            translateY > 0
        ) {

            translateY = 0;

        }

    }

}


/* =========================================================
   Transform
========================================================= */

function applyTransform() {

    clampTranslation();


    image.style.transform =
        "translate(" +
        translateX +
        "px, " +
        translateY +
        "px) " +
        "scale(" +
        getActualScale() +
        ")";

}


/* =========================================================
   Fit scale
========================================================= */

function calculateFitScale() {

    if (
        !image.naturalWidth ||
        !image.naturalHeight
    ) {

        return 1;

    }


    let viewportWidth =
        viewer.clientWidth;


    let viewportHeight =
        viewer.clientHeight;


    if (window.visualViewport) {

        viewportWidth =
            window.visualViewport.width;

        viewportHeight =
            window.visualViewport.height;

    }


    const widthScale =
        viewportWidth /
        image.naturalWidth;


    const heightScale =
        viewportHeight /
        image.naturalHeight;


    return Math.min(
        widthScale,
        heightScale
    );

}


/* =========================================================
   Reset
========================================================= */

function resetView() {

    fitScale =
        calculateFitScale();


    scale =
        INITIAL_SCALE;


    translateX = 0;

    translateY = 0;


    applyTransform();

}


/* =========================================================
   Scale
========================================================= */

function setScale(
    newScale,
    centerX,
    centerY
) {

    const oldActualScale =
        getActualScale();


    const newRelativeScale =
        Math.max(
            MIN_SCALE,
            Math.min(
                MAX_SCALE,
                newScale
            )
        );


    const newActualScale =
        fitScale *
        newRelativeScale;


    const imageX =
        (
            centerX -
            translateX
        ) /
        oldActualScale;


    const imageY =
        (
            centerY -
            translateY
        ) /
        oldActualScale;


    translateX =
        centerX -
        imageX *
        newActualScale;


    translateY =
        centerY -
        imageY *
        newActualScale;


    scale =
        newRelativeScale;


    applyTransform();

}


/* =========================================================
   Zoom
========================================================= */

function zoomIn(
    centerX,
    centerY
) {

    if (
        typeof centerX !== "number"
    ) {

        centerX =
            viewer.clientWidth / 2;

    }


    if (
        typeof centerY !== "number"
    ) {

        centerY =
            viewer.clientHeight / 2;

    }


    setScale(
        scale * ZOOM_STEP,
        centerX,
        centerY
    );

}


function zoomOut(
    centerX,
    centerY
) {

    if (
        typeof centerX !== "number"
    ) {

        centerX =
            viewer.clientWidth / 2;

    }


    if (
        typeof centerY !== "number"
    ) {

        centerY =
            viewer.clientHeight / 2;

    }


    setScale(
        scale / ZOOM_STEP,
        centerX,
        centerY
    );

}


/* =========================================================
   画像読み込み
========================================================= */

function loadImage(
    imageURL,
    imageTitle
) {

    if (!imageURL) {

        loading.textContent =
            "画像URLが指定されていません。";

        return;

    }


    loading.style.display =
        "block";


    image.style.display =
        "none";


    const newImage =
        new Image();


    newImage.onload =
        function () {

            image.src =
                imageURL;


            image.alt =
                imageTitle || "";


            titleElement.textContent =
                imageTitle || "";


            loading.style.display =
                "none";


            image.style.display =
                "block";


            resetView();

        };


    newImage.onerror =
        function () {

            loading.textContent =
                "画像を読み込めませんでした。";

            image.style.display =
                "none";

        };


    newImage.src =
        imageURL;

}

/* =========================================================
   Service Workerからの画像変更要求
========================================================= */

if ("serviceWorker" in navigator) {

    navigator.serviceWorker.addEventListener(
        "message",
        function (event) {

            const data =
                event.data;

            if (!data) {
                return;
            }


            if (
                data.type !==
                "funadamariSetImage"
            ) {
                return;
            }


            if (!data.image) {
                return;
            }


            /* ------------------------------------------------
               viewer自身を前面にする
               ------------------------------------------------ */

            try {

                window.focus();

            }
            catch (error) {

                console.warn(
                    "window.focus() failed:",
                    error
                );

            }


            /* ------------------------------------------------
               新しい画像を読み込む
               ------------------------------------------------ */

            loadImage(
                data.image,
                data.title || ""
            );

        }
    );

}

/* =========================================================
   Service Worker登録
========================================================= */

if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register(
        "/sw.js",
        {
            scope: "/"
        }
    )
    .then(
        function (registration) {

            console.log(
                "Service Worker registered:",
                registration.scope
            );

        }
    )
    .catch(
        function (error) {

            console.error(
                "Service Worker registration failed:",
                error
            );

        }
    );

}
      
/* =========================================================
   Active viewer登録
========================================================= */

function registerAsActiveViewer() {

    try {

        localStorage.setItem(
            ACTIVE_VIEWER_KEY,
            JSON.stringify({

                id:
                    VIEWER_ID,

                timestamp:
                    Date.now()

            })
        );

    }
    catch (error) {

        console.error(
            "active viewer registration error:",
            error
        );

    }

}

/* =========================================================
   Active Viewer定期更新
   ========================================================= */

setInterval(
  function () {

    registerAsActiveViewer();

  },
  10000
);

/* =========================================================
   Active viewer解除
========================================================= */

function unregisterActiveViewer() {

    try {

        const raw =
            localStorage.getItem(
                ACTIVE_VIEWER_KEY
            );


        if (!raw) {

            return;

        }


        const info =
            JSON.parse(raw);


        if (
            info &&
            info.id === VIEWER_ID
        ) {

            localStorage.removeItem(
                ACTIVE_VIEWER_KEY
            );

        }

    }
    catch (error) {

        console.error(
            "active viewer unregister error:",
            error
        );

    }

}


/* =========================================================
   Active viewer判定
========================================================= */

function isActiveViewer() {

    try {

        const raw =
            localStorage.getItem(
                ACTIVE_VIEWER_KEY
            );


        if (!raw) {

            return false;

        }


        const info =
            JSON.parse(raw);


        if (
            !info ||
            info.id !== VIEWER_ID
        ) {

            return false;

        }


        if (info.timestamp) {

            const age =
                Date.now() -
                Number(info.timestamp);


            if (
                age >
                REQUEST_VALID_TIME
            ) {

                return false;

            }

        }


        return true;

    }
    catch (error) {

        return false;

    }

}


/* =========================================================
   launcherからの画像変更要求
========================================================= */

function checkViewerRequest() {

    const raw =
        localStorage.getItem(
            VIEWER_STORAGE_KEY
        );


    if (!raw) {

        return;

    }


    let request;


    try {

        request =
            JSON.parse(raw);

    }
    catch (error) {

        return;

    }


    if (!request) {

        return;

    }


    if (request.timestamp) {

        const age =
            Date.now() -
            Number(request.timestamp);


        if (
            age >
            REQUEST_VALID_TIME
        ) {

            return;

        }

    }


    /*
       自分宛てか
    */

    if (
        request.targetViewerId !==
        VIEWER_ID
    ) {

        return;

    }


    /*
       active viewerか
    */

    if (
        !isActiveViewer()
    ) {

        return;

    }


    /*
       画像変更
    */

    loadImage(
        request.image,
        request.title
    );

}


/* =========================================================
   storage event
========================================================= */

window.addEventListener(
    "storage",
    function (event) {

        if (
            event.key ===
            VIEWER_STORAGE_KEY
        ) {

            checkViewerRequest();

        }

    }
);


/* =========================================================
   pointerdown
========================================================= */

viewer.addEventListener(
    "pointerdown",
    function (event) {

        if (
            event.target.closest(
                "#controls"
            )
        ) {

            return;

        }


        viewer.setPointerCapture(
            event.pointerId
        );


        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );


        tapStartX =
            event.clientX;


        tapStartY =
            event.clientY;


        tapMoved =
            false;


        if (
            pointers.size === 1
        ) {

            isDragging =
                true;


            dragLastX =
                event.clientX;


            dragLastY =
                event.clientY;

        }


        if (
            pointers.size === 2
        ) {

            isDragging =
                false;


            const values =
                Array.from(
                    pointers.values()
                );


            const p1 =
                values[0];


            const p2 =
                values[1];


            pinchStartDistance =
                Math.hypot(
                    p2.x - p1.x,
                    p2.y - p1.y
                );


            pinchStartScale =
                scale;


            pinchCenterX =
                (p1.x + p2.x) / 2;


            pinchCenterY =
                (p1.y + p2.y) / 2;

        }

    }
);


/* =========================================================
   pointermove
========================================================= */

viewer.addEventListener(
    "pointermove",
    function (event) {

        if (
            !pointers.has(
                event.pointerId
            )
        ) {

            return;

        }


        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );


        if (
            pointers.size === 1 &&
            isDragging
        ) {

            const dx =
                event.clientX -
                dragLastX;


            const dy =
                event.clientY -
                dragLastY;


            if (
                Math.abs(
                    event.clientX -
                    tapStartX
                ) >
                TAP_MOVE_THRESHOLD ||
                Math.abs(
                    event.clientY -
                    tapStartY
                ) >
                TAP_MOVE_THRESHOLD
            ) {

                tapMoved =
                    true;

            }


            translateX += dx;

            translateY += dy;


            dragLastX =
                event.clientX;


            dragLastY =
                event.clientY;


            applyTransform();

        }


        if (
            pointers.size === 2
        ) {

            const values =
                Array.from(
                    pointers.values()
                );


            const p1 =
                values[0];


            const p2 =
                values[1];


            const distance =
                Math.hypot(
                    p2.x - p1.x,
                    p2.y - p1.y
                );


            const centerX =
                (p1.x + p2.x) / 2;


            const centerY =
                (p1.y + p2.y) / 2;


            if (
                pinchStartDistance > 0
            ) {

                const ratio =
                    distance /
                    pinchStartDistance;


                setScale(
                    pinchStartScale *
                    ratio,
                    centerX,
                    centerY
                );

            }


            tapMoved =
                true;

        }

    }
);


/* =========================================================
   pointerup
========================================================= */

viewer.addEventListener(
    "pointerup",
    function (event) {

        pointers.delete(
            event.pointerId
        );


        if (
            pointers.size === 1
        ) {

            const remaining =
                Array.from(
                    pointers.values()
                )[0];


            dragLastX =
                remaining.x;


            dragLastY =
                remaining.y;


            isDragging =
                true;


            tapMoved =
                true;


            return;

        }


        if (
            pointers.size === 0
        ) {

            isDragging =
                false;

        }


        if (!tapMoved) {

            const now =
                Date.now();


            const distance =
                Math.hypot(
                    event.clientX -
                    lastTapX,
                    event.clientY -
                    lastTapY
                );


            if (
                now -
                lastTapTime <
                DOUBLE_TAP_TIME &&
                distance <
                DOUBLE_TAP_DISTANCE
            ) {

                if (
                    Math.abs(
                        scale -
                        DOUBLE_TAP_SCALE
                    ) <
                    0.01
                ) {

                    setScale(
                        INITIAL_SCALE,
                        event.clientX,
                        event.clientY
                    );

                }
                else {

                    setScale(
                        DOUBLE_TAP_SCALE,
                        event.clientX,
                        event.clientY
                    );

                }


                lastTapTime = 0;

            }
            else {

                lastTapTime =
                    now;


                lastTapX =
                    event.clientX;


                lastTapY =
                    event.clientY;

            }

        }

    }
);


/* =========================================================
   pointercancel
========================================================= */

viewer.addEventListener(
    "pointercancel",
    function (event) {

        pointers.delete(
            event.pointerId
        );


        if (
            pointers.size === 0
        ) {

            isDragging =
                false;

        }

    }
);


/* =========================================================
   PC double click
========================================================= */

viewer.addEventListener(
    "dblclick",
    function (event) {

        if (
            event.target.closest(
                "#controls"
            )
        ) {

            return;

        }


        if (
            Math.abs(
                scale -
                DOUBLE_TAP_SCALE
            ) <
            0.01
        ) {

            setScale(
                INITIAL_SCALE,
                event.clientX,
                event.clientY
            );

        }
        else {

            setScale(
                DOUBLE_TAP_SCALE,
                event.clientX,
                event.clientY
            );

        }

    }
);


/* =========================================================
   Mouse wheel
========================================================= */

viewer.addEventListener(
    "wheel",
    function (event) {

        event.preventDefault();


        if (
            event.deltaY < 0
        ) {

            zoomIn(
                event.clientX,
                event.clientY
            );

        }
        else {

            zoomOut(
                event.clientX,
                event.clientY
            );

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   ボタン
========================================================= */

zoomInButton.addEventListener(
    "click",
    function () {

        zoomIn();

    }
);


zoomOutButton.addEventListener(
    "click",
    function () {

        zoomOut();

    }
);


resetButton.addEventListener(
    "click",
    function () {

        resetView();

    }
);


/* =========================================================
   Close
========================================================= */

closeButton.addEventListener(
    "click",
    function () {

        unregisterActiveViewer();


        try {

            window.close();

        }
        catch (error) {

            // ignore

        }

    }
);


/* =========================================================
   Viewport変更
========================================================= */

function handleViewportChange() {

    if (
        !image.naturalWidth
    ) {

        return;

    }


    const oldActualScale =
        getActualScale();


    const centerX =
        viewer.clientWidth / 2;


    const centerY =
        viewer.clientHeight / 2;


    const imageX =
        (
            centerX -
            translateX
        ) /
        oldActualScale;


    const imageY =
        (
            centerY -
            translateY
        ) /
        oldActualScale;


    fitScale =
        calculateFitScale();


    const newActualScale =
        getActualScale();


    translateX =
        centerX -
        imageX *
        newActualScale;


    translateY =
        centerY -
        imageY *
        newActualScale;


    applyTransform();

}


window.addEventListener(
    "resize",
    handleViewportChange
);


if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        handleViewportChange
    );

}


/* =========================================================
   visibility
========================================================= */

document.addEventListener(
    "visibilitychange",
    function () {

        if (
            document.visibilityState ===
            "visible"
        ) {

            registerAsActiveViewer();

        }

    }
);


/* =========================================================
   pagehide
========================================================= */

window.addEventListener(
    "pagehide",
    function () {

        unregisterActiveViewer();

    }
);


/* =========================================================
   contextmenu
========================================================= */

viewer.addEventListener(
    "contextmenu",
    function (event) {

        event.preventDefault();

    }
);


/* =========================================================
   初期化

registerAsActiveViewer();
