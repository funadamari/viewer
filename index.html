<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Photo Viewer</title>


<style>

/* =========================================================
   基本
========================================================= */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: sans-serif;

}


/* =========================================================
   Viewer
========================================================= */

#viewer {

    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #000;

    /*
       ブラウザ標準の
       タッチスクロールを停止し、
       viewer自身でピンチ・ドラッグを処理する。
    */

    touch-action: none;

    cursor: default;

}


/* =========================================================
   画像
========================================================= */

#photo {

    position: absolute;

    left: 50%;
    top: 50%;

    transform-origin: center center;

    /*
       画像を直接ドラッグしない。
       viewer側でPointer Eventsを処理する。
    */

    pointer-events: none;

    user-select: none;
    -webkit-user-select: none;

    -webkit-user-drag: none;

    max-width: none;
    max-height: none;

    will-change: transform;

}


/* =========================================================
   タイトル
========================================================= */

#title {

    position: fixed;

    top: calc(
        10px +
        env(safe-area-inset-top)
    );

    left: calc(
        10px +
        env(safe-area-inset-left)
    );

    z-index: 20;

    max-width:
        calc(100vw - 90px);

    padding: 6px 10px;

    box-sizing: border-box;

    color: white;

    background:
        rgba(0, 0, 0, 0.55);

    border-radius: 5px;

    font-size: 15px;

    line-height: 1.4;

    display: none;

    pointer-events: none;

}


/* =========================================================
   操作ボタン
========================================================= */

#controls {

    position: fixed;

    left: 50%;

    bottom: calc(
        15px +
        env(safe-area-inset-bottom)
    );

    transform:
        translateX(-50%);

    z-index: 30;

    display: flex;

    gap: 8px;

    padding: 6px 8px;

    background:
        rgba(0, 0, 0, 0.45);

    border-radius: 10px;

    user-select: none;
    -webkit-user-select: none;

    touch-action: manipulation;

}


#controls button {

    width: 44px;
    height: 40px;

    border: none;

    border-radius: 6px;

    background:
        rgba(255, 255, 255, 0.85);

    color: #111;

    font-size: 22px;

    line-height: 40px;

    padding: 0;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;

    touch-action: manipulation;

}


#controls button:active {

    background:
        rgba(255, 255, 255, 0.60);

}


/* =========================================================
   閉じるボタン
========================================================= */

#close {

    position: fixed;

    right: calc(
        10px +
        env(safe-area-inset-right)
    );

    top: calc(
        10px +
        env(safe-area-inset-top)
    );

    z-index: 30;

    width: 42px;
    height: 42px;

    border: none;

    border-radius: 50%;

    background:
        rgba(0, 0, 0, 0.55);

    color: white;

    font-size: 28px;

    line-height: 42px;

    padding: 0;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;

    touch-action: manipulation;

}


/* =========================================================
   読み込み表示
========================================================= */

#loading {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 10;

    color: white;

    font-size: 16px;

    display: none;

    pointer-events: none;

}

</style>

</head>


<body>


<div id="viewer">


    <div id="loading">
        読み込み中…
    </div>


    <div id="title"></div>


    <img
        id="photo"
        draggable="false"
        alt=""
    >


    <button
        id="close"
        type="button"
    >
        ×
    </button>


    <div id="controls">

        <button
            id="zoomOut"
            type="button"
            aria-label="縮小"
        >
            −
        </button>


        <button
            id="zoomIn"
            type="button"
            aria-label="拡大"
        >
            ＋
        </button>


        <button
            id="reset"
            type="button"
            aria-label="リセット"
        >
            ↺
        </button>

    </div>


</div>



<script>

/* =========================================================
   URLパラメータ
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


let imageURL =
    params.get("image");


let titleText =
    params.get("title") || "";


/* =========================================================
   launcher連携
========================================================= */

/*
   launcherとviewerの間で共有する
   localStorageのキー
*/

const VIEWER_STORAGE_KEY =
    "funadamariViewerRequest";


/*
   launcherからの要求を
   古いデータとして誤使用しないための時間。

   30秒以内の要求だけを有効とする。
*/

const REQUEST_VALID_TIME =
    30 * 1000;


/* =========================================================
   DOM
========================================================= */

const viewer =
    document.getElementById(
        "viewer"
    );


const photo =
    document.getElementById(
        "photo"
    );


const title =
    document.getElementById(
        "title"
    );


const loading =
    document.getElementById(
        "loading"
    );


const zoomInButton =
    document.getElementById(
        "zoomIn"
    );


const zoomOutButton =
    document.getElementById(
        "zoomOut"
    );


const resetButton =
    document.getElementById(
        "reset"
    );


const closeButton =
    document.getElementById(
        "close"
    );


/* =========================================================
   ズーム設定
========================================================= */


/*
   初期表示。

   画面いっぱいに収まる倍率を100%とした場合、
   90%で表示する。
*/

const INITIAL_SCALE =
    0.90;


/*
   ダブルクリック／ダブルタップ
   で拡大する倍率。
*/

const DOUBLE_TAP_SCALE =
    2.00;


/*
   最小・最大倍率。
*/

const MIN_SCALE =
    0.40;


const MAX_SCALE =
    5.00;


/*
   ＋／−、ホイールの倍率変更量。
*/

const ZOOM_STEP =
    1.20;


/* =========================================================
   ダブルタップ設定
========================================================= */

const DOUBLE_TAP_TIME =
    350;


const DOUBLE_TAP_DISTANCE =
    30;


/*
   タップとドラッグを区別する距離。
*/

const TAP_MOVE_THRESHOLD =
    12;


/* =========================================================
   状態
========================================================= */


/*
   画像を画面いっぱいに収めるための倍率。
*/

let fitScale =
    1;


/*
   fitScaleを1とした相対倍率。
*/

let scale =
    INITIAL_SCALE;


/*
   画像の移動量。
*/

let translateX =
    0;


let translateY =
    0;


/* =========================================================
   Pointer管理
========================================================= */

const pointers =
    new Map();


/*
   1本指ドラッグ用。
*/

let dragLastX =
    0;


let dragLastY =
    0;


/*
   ピンチ用。
*/

let pinchStartDistance =
    0;


let pinchStartScale =
    1;


/* =========================================================
   タップ判定
========================================================= */

let tapStartX =
    0;


let tapStartY =
    0;


let tapStartTime =
    0;


let tapMoved =
    false;


/*
   前回のタップ。
*/

let lastTapTime =
    0;


let lastTapX =
    0;


let lastTapY =
    0;


/* =========================================================
   タイトル表示
========================================================= */

function updateTitle(
    newTitle
) {

    titleText =
        newTitle || "";


    if (titleText) {

        title.textContent =
            titleText;

        title.style.display =
            "block";

    } else {

        title.textContent =
            "";

        title.style.display =
            "none";

    }

}


/*
   初期タイトル。
*/

updateTitle(
    titleText
);


/* =========================================================
   画像URL変更
========================================================= */

function loadImage(
    newImageURL,
    newTitle = ""
) {

    if (!newImageURL) {

        return;

    }


    loading.style.display =
        "block";

    loading.textContent =
        "読み込み中…";


    /*
       新しいImageオブジェクトで
       先に画像を読み込む。

       読み込み完了後に表示画像を
       変更することで、
       切り替え途中の表示を防ぐ。
    */

    const testImage =
        new Image();


    testImage.onload =
        function () {

            /*
               URLを更新。
            */

            imageURL =
                newImageURL;


            /*
               表示画像を変更。
            */

            photo.src =
                newImageURL;


            /*
               タイトル変更。
            */

            updateTitle(
                newTitle
            );


            /*
               新しい画像では
               初期表示に戻す。
            */

            calculateFitScale();

            resetView();


            loading.style.display =
                "none";

        };


    testImage.onerror =
        function () {

            loading.style.display =
                "block";

            loading.textContent =
                "画像を読み込めませんでした。";

        };


    testImage.src =
        newImageURL;

}


/* =========================================================
   初期画像
========================================================= */

if (imageURL) {

    loading.style.display =
        "block";

    loadImage(
        imageURL,
        titleText
    );

} else {

    loading.style.display =
        "block";

    loading.textContent =
        "画像URLが指定されていません。";

}


/* =========================================================
   fitScale計算
========================================================= */

function calculateFitScale() {

    if (
        !photo.naturalWidth ||
        !photo.naturalHeight
    ) {

        return;

    }


    let viewportWidth;
    let viewportHeight;


    /*
       visualViewportが利用できる場合は
       そちらを使用する。

       iPhoneのアドレスバー変化にも対応。
    */

    if (window.visualViewport) {

        viewportWidth =
            window.visualViewport.width;

        viewportHeight =
            window.visualViewport.height;

    } else {

        viewportWidth =
            window.innerWidth;

        viewportHeight =
            window.innerHeight;

    }


    const widthRatio =
        viewportWidth /
        photo.naturalWidth;


    const heightRatio =
        viewportHeight /
        photo.naturalHeight;


    fitScale =
        Math.min(
            widthRatio,
            heightRatio
        );

}


/* =========================================================
   画像表示更新
========================================================= */

function updateImage() {

    if (!photo.naturalWidth) {

        return;

    }


    const actualScale =
        fitScale * scale;


    photo.style.width =
        photo.naturalWidth + "px";


    photo.style.height =
        photo.naturalHeight + "px";


    photo.style.transform =
        "translate(-50%, -50%) " +
        "translate(" +
        translateX +
        "px, " +
        translateY +
        "px) " +
        "scale(" +
        actualScale +
        ")";

}


/* =========================================================
   移動量制限
========================================================= */

function clampTranslation() {

    if (!photo.naturalWidth) {

        return;

    }


    let viewportWidth;
    let viewportHeight;


    if (window.visualViewport) {

        viewportWidth =
            window.visualViewport.width;

        viewportHeight =
            window.visualViewport.height;

    } else {

        viewportWidth =
            window.innerWidth;

        viewportHeight =
            window.innerHeight;

    }


    const actualScale =
        fitScale * scale;


    const imageWidth =
        photo.naturalWidth *
        actualScale;


    const imageHeight =
        photo.naturalHeight *
        actualScale;


    /*
       横方向
    */

    if (
        imageWidth <=
        viewportWidth
    ) {

        translateX = 0;

    } else {

        const maxX =
            (
                imageWidth -
                viewportWidth
            ) / 2;


        translateX =
            Math.max(
                -maxX,
                Math.min(
                    maxX,
                    translateX
                )
            );

    }


    /*
       縦方向
    */

    if (
        imageHeight <=
        viewportHeight
    ) {

        translateY = 0;

    } else {

        const maxY =
            (
                imageHeight -
                viewportHeight
            ) / 2;


        translateY =
            Math.max(
                -maxY,
                Math.min(
                    maxY,
                    translateY
                )
            );

    }

}


/* =========================================================
   ズーム変更
========================================================= */

function setScale(
    newScale,
    centerX =
        window.innerWidth / 2,
    centerY =
        window.innerHeight / 2
) {

    if (!photo.naturalWidth) {

        return;

    }


    newScale =
        Math.max(
            MIN_SCALE,
            Math.min(
                MAX_SCALE,
                newScale
            )
        );


    const oldActualScale =
        fitScale * scale;


    const newActualScale =
        fitScale * newScale;


    /*
       画像中心の現在位置。
    */

    const imageCenterX =
        window.innerWidth / 2 +
        translateX;


    const imageCenterY =
        window.innerHeight / 2 +
        translateY;


    const relativeX =
        centerX -
        imageCenterX;


    const relativeY =
        centerY -
        imageCenterY;


    if (oldActualScale !== 0) {

        translateX =
            centerX -
            window.innerWidth / 2 -
            relativeX *
            (
                newActualScale /
                oldActualScale
            );


        translateY =
            centerY -
            window.innerHeight / 2 -
            relativeY *
            (
                newActualScale /
                oldActualScale
            );

    }


    scale =
        newScale;


    /*
       初期倍率以下では
       初期位置へ戻す。
    */

    if (
        scale <=
        INITIAL_SCALE
    ) {

        scale =
            INITIAL_SCALE;

        translateX =
            0;

        translateY =
            0;

    }


    clampTranslation();

    updateImage();

}


/* =========================================================
   リセット
========================================================= */

function resetView() {

    scale =
        INITIAL_SCALE;


    translateX =
        0;


    translateY =
        0;


    updateImage();

}


/* =========================================================
   ボタン
========================================================= */

zoomInButton.addEventListener(
    "click",
    function (event) {

        event.stopPropagation();


        setScale(
            scale * ZOOM_STEP,
            window.innerWidth / 2,
            window.innerHeight / 2
        );

    }
);


zoomOutButton.addEventListener(
    "click",
    function (event) {

        event.stopPropagation();


        setScale(
            scale / ZOOM_STEP,
            window.innerWidth / 2,
            window.innerHeight / 2
        );

    }
);


resetButton.addEventListener(
    "click",
    function (event) {

        event.stopPropagation();

        resetView();

    }
);


/* =========================================================
   ボタンのPointerイベントをviewerに伝えない
========================================================= */

document
    .querySelectorAll(
        "#controls button, #close"
    )
    .forEach(
        function (button) {

            button.addEventListener(
                "pointerdown",
                function (event) {

                    event.stopPropagation();

                }
            );


            button.addEventListener(
                "pointermove",
                function (event) {

                    event.stopPropagation();

                }
            );


            button.addEventListener(
                "pointerup",
                function (event) {

                    event.stopPropagation();

                }
            );

        }
    );


/* =========================================================
   閉じる
========================================================= */

closeButton.addEventListener(
    "click",
    function (event) {

        event.stopPropagation();


        if (
            window.history.length > 1
        ) {

            window.history.back();

        } else {

            window.close();

        }

    }
);


/* =========================================================
   Pointer Down
========================================================= */

viewer.addEventListener(
    "pointerdown",
    function (event) {

        /*
           ボタン上では何もしない。
        */

        if (
            event.target.closest("button")
        ) {

            return;

        }


        /*
           Pointerを登録。
        */

        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );


        /*
           Pointer Capture。

           指／マウスがviewerの外へ
           出ても操作を継続する。
        */

        try {

            viewer.setPointerCapture(
                event.pointerId
            );

        } catch (error) {
            // ignore
        }


        /*
           1本目
        */

        if (
            pointers.size === 1
        ) {

            dragLastX =
                event.clientX;


            dragLastY =
                event.clientY;


            /*
               ダブルタップ判定用。
            */

            tapStartX =
                event.clientX;


            tapStartY =
                event.clientY;


            tapStartTime =
                performance.now();


            tapMoved =
                false;

        }


        /*
           2本になったらピンチ。
        */

        if (
            pointers.size === 2
        ) {

            /*
               タップ候補をキャンセル。
            */

            tapMoved =
                true;


            const values =
                Array.from(
                    pointers.values()
                );


            pinchStartDistance =
                distance(
                    values[0],
                    values[1]
                );


            pinchStartScale =
                scale;

        }

    }
);


/* =========================================================
   Pointer Move
========================================================= */

viewer.addEventListener(
    "pointermove",
    function (event) {

        if (
            !pointers.has(
                event.pointerId
            )
        ) {

            return;

        }


        /*
           現在位置を更新。
        */

        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );


        /*
           2本指 → ピンチ
        */

        if (
            pointers.size === 2
        ) {

            tapMoved =
                true;


            const values =
                Array.from(
                    pointers.values()
                );


            const currentDistance =
                distance(
                    values[0],
                    values[1]
                );


            if (
                pinchStartDistance > 0
            ) {

                const ratio =
                    currentDistance /
                    pinchStartDistance;


                const newScale =
                    pinchStartScale *
                    ratio;


                /*
                   ピンチ中心。
                */

                const centerX =
                    (
                        values[0].x +
                        values[1].x
                    ) / 2;


                const centerY =
                    (
                        values[0].y +
                        values[1].y
                    ) / 2;


                setScale(
                    newScale,
                    centerX,
                    centerY
                );

            }


            return;

        }


        /*
           1本指
        */

        if (
            pointers.size === 1
        ) {

            /*
               タップ判定用移動距離。
            */

            const dx =
                event.clientX -
                tapStartX;


            const dy =
                event.clientY -
                tapStartY;


            const movedDistance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                movedDistance >
                TAP_MOVE_THRESHOLD
            ) {

                tapMoved =
                    true;

            }


            /*
               拡大中のみ1本指ドラッグ。
            */

            if (
                scale >
                INITIAL_SCALE &&
                tapMoved
            ) {

                const moveX =
                    event.clientX -
                    dragLastX;


                const moveY =
                    event.clientY -
                    dragLastY;


                translateX +=
                    moveX;


                translateY +=
                    moveY;


                clampTranslation();

                updateImage();

            }


            /*
               次の移動の基準位置。
            */

            dragLastX =
                event.clientX;


            dragLastY =
                event.clientY;

        }

    }
);


/* =========================================================
   Pointer Up
========================================================= */

viewer.addEventListener(
    "pointerup",
    function (event) {

        if (
            !pointers.has(
                event.pointerId
            )
        ) {

            return;

        }


        const releasedX =
            event.clientX;


        const releasedY =
            event.clientY;


        /*
           2本指だったか。
        */

        const wasTwoFinger =
            pointers.size >= 2;


        /*
           Pointerを削除。
        */

        pointers.delete(
            event.pointerId
        );


        /*
           Capture解除。
        */

        try {

            viewer.releasePointerCapture(
                event.pointerId
            );

        } catch (error) {
            // ignore
        }


        /*
           ピンチ終了後、
           1本の指が残った場合。
        */

        if (
            wasTwoFinger &&
            pointers.size === 1
        ) {

            const remaining =
                Array.from(
                    pointers.values()
                )[0];


            /*
               ここが重要。

               残った指の現在位置を
               新しいドラッグ開始位置にする。

               これにより、
               ピンチ終了直後のドラッグで
               画像が飛ばない。
            */

            dragLastX =
                remaining.x;


            dragLastY =
                remaining.y;


            /*
               ピンチ後なので、
               タップとはみなさない。
            */

            tapMoved =
                true;


            return;

        }


        /*
           全てのPointerが離れた。
        */

        if (
            pointers.size === 0
        ) {

            const now =
                performance.now();


            const duration =
                now -
                tapStartTime;


            const dx =
                releasedX -
                tapStartX;


            const dy =
                releasedY -
                tapStartY;


            const movedDistance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /*
               タップ成立条件。
            */

            const isTap =
                !tapMoved &&
                duration <=
                    DOUBLE_TAP_TIME &&
                movedDistance <=
                    TAP_MOVE_THRESHOLD;


            if (isTap) {

                const tapInterval =
                    now -
                    lastTapTime;


                const tapDistance =
                    Math.sqrt(
                        Math.pow(
                            releasedX -
                            lastTapX,
                            2
                        ) +
                        Math.pow(
                            releasedY -
                            lastTapY,
                            2
                        )
                    );


                /*
                   ダブルタップ成立。
                */

                if (
                    tapInterval <=
                        DOUBLE_TAP_TIME &&
                    tapDistance <=
                        DOUBLE_TAP_DISTANCE
                ) {

                    if (
                        scale <=
                        INITIAL_SCALE +
                        0.001
                    ) {

                        /*
                           初期90% → 200%
                        */

                        setScale(
                            DOUBLE_TAP_SCALE,
                            releasedX,
                            releasedY
                        );

                    } else {

                        /*
                           拡大中 → 初期90%
                        */

                        resetView();

                    }


                    /*
                       ダブルタップ処理終了。
                    */

                    lastTapTime =
                        0;

                } else {

                    /*
                       1回目のタップ。
                    */

                    lastTapTime =
                        now;


                    lastTapX =
                        releasedX;


                    lastTapY =
                        releasedY;

                }

            }

        }

    }
);


/* =========================================================
   Pointer Cancel
========================================================= */

viewer.addEventListener(
    "pointercancel",
    function (event) {

        pointers.delete(
            event.pointerId
        );


        tapMoved =
            true;


        /*
           ピンチ後に1本残った場合の
           ドラッグ基準位置を再設定。
        */

        if (
            pointers.size === 1
        ) {

            const remaining =
                Array.from(
                    pointers.values()
                )[0];


            dragLastX =
                remaining.x;


            dragLastY =
                remaining.y;

        }

    }
);


/* =========================================================
   2点間距離
========================================================= */

function distance(a, b) {

    const dx =
        b.x - a.x;


    const dy =
        b.y - a.y;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   マウスホイール
========================================================= */

viewer.addEventListener(
    "wheel",
    function (event) {

        if (
            event.target.closest("button")
        ) {

            return;

        }


        event.preventDefault();


        let newScale;


        if (
            event.deltaY < 0
        ) {

            newScale =
                scale *
                ZOOM_STEP;

        } else {

            newScale =
                scale /
                ZOOM_STEP;

        }


        setScale(
            newScale,
            event.clientX,
            event.clientY
        );

    },
    {
        passive: false
    }
);


/* =========================================================
   PCのダブルクリック
========================================================= */

viewer.addEventListener(
    "dblclick",
    function (event) {

        if (
            event.target.closest("button")
        ) {

            return;

        }


        event.preventDefault();


        if (
            scale <=
            INITIAL_SCALE +
            0.001
        ) {

            setScale(
                DOUBLE_TAP_SCALE,
                event.clientX,
                event.clientY
            );

        } else {

            resetView();

        }


        /*
           Pointer Events側の
           ダブルタップ処理との
           二重実行を防ぐ。
        */

        lastTapTime =
            0;

    }
);


/* =========================================================
   launcherからの画像変更
========================================================= */

window.addEventListener(
    "storage",
    function (event) {

        /*
           launcherが保存した
           viewer用データだけ処理する。
        */

        if (
            event.key !==
            VIEWER_STORAGE_KEY
        ) {

            return;

        }


        if (!event.newValue) {

            return;

        }


        try {

            const request =
                JSON.parse(
                    event.newValue
                );


            if (
                !request.image
            ) {

                return;

            }


            /*
               期限切れの要求は無視。
            */

            if (
                request.timestamp &&
                (
                    Date.now() -
                    request.timestamp
                ) >
                REQUEST_VALID_TIME
            ) {

                return;

            }


            /*
               新しい画像を表示。
            */

            loadImage(
                request.image,
                request.title || ""
            );


        } catch (error) {

            console.error(
                "viewer storage event error:",
                error
            );

        }

    }
);


/* =========================================================
   viewer起動時のlauncher要求確認
========================================================= */

function checkViewerRequest() {

    try {

        const saved =
            localStorage.getItem(
                VIEWER_STORAGE_KEY
            );


        if (!saved) {

            return;

        }


        const request =
            JSON.parse(saved);


        if (
            !request.image
        ) {

            return;

        }


        /*
           古い要求なら無視。
        */

        if (
            request.timestamp &&
            (
                Date.now() -
                request.timestamp
            ) >
            REQUEST_VALID_TIME
        ) {

            return;

        }


        /*
           既に同じ画像なら何もしない。
        */

        if (
            request.image ===
                imageURL &&
            (
                request.title || ""
            ) ===
            (
                titleText || ""
            )
        ) {

            return;

        }


        /*
           launcherから要求された画像。
        */

        loadImage(
            request.image,
            request.title || ""
        );


    } catch (error) {

        console.error(
            "viewer startup request error:",
            error
        );

    }

}


checkViewerRequest();


/* =========================================================
   画面サイズ変更
========================================================= */

function handleViewportChange() {

    if (
        !photo.naturalWidth
    ) {

        return;

    }


    /*
       現在の相対倍率は維持。
    */

    calculateFitScale();

    clampTranslation();

    updateImage();

}


/*
   ウィンドウサイズ変更。
*/

window.addEventListener(
    "resize",
    handleViewportChange
);


/*
   iPhone等のviewport変更。
*/

if (
    window.visualViewport
) {

    window.visualViewport.addEventListener(
        "resize",
        handleViewportChange
    );

}


/* =========================================================
   コンテキストメニュー禁止
========================================================= */

viewer.addEventListener(
    "contextmenu",
    function (event) {

        event.preventDefault();

    }
);

</script>
