<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=5,
               user-scalable=yes,
               viewport-fit=cover">

<title>ふなだまり写真</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================================
   ビューア
   ========================================= */

#viewer {

    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;

    /*
     * JavaScriptで実際の表示領域を設定する
     */
    height: 100vh;

    background: #000;

    overflow: hidden;

    touch-action: none;

    display: flex;

    justify-content: center;
    align-items: center;

    user-select: none;
    -webkit-user-select: none;
}


/* =========================================
   写真
   ========================================= */

#image {

    position: absolute;

    display: block;

    max-width: none;
    max-height: none;

    transform-origin: center center;

    user-select: none;

    -webkit-user-select: none;

    -webkit-user-drag: none;

    cursor: grab;

    touch-action: none;

    will-change: transform;
}

#image.dragging {

    cursor: grabbing;
}


/* =========================================
   閉じるボタン
   ========================================= */

#closeButton {

    position: fixed;

    right: 14px;

    top:
        calc(
            env(safe-area-inset-top, 0px)
            + 12px
        );

    width: 44px;
    height: 44px;

    border: none;

    border-radius: 50%;

    background:
        rgba(30,30,30,0.65);

    color: white;

    font-size: 28px;

    z-index: 30;

}


/* =========================================
   操作ボタン
   ========================================= */

#controls {

    position: fixed;

    left: 50%;

    bottom:
        calc(
            env(safe-area-inset-bottom, 0px)
            + 18px
        );

    transform:
        translateX(-50%);

    display: flex;

    gap: 10px;

    padding: 8px 10px;

    background:
        rgba(0,0,0,0.35);

    border-radius: 28px;

    z-index: 30;
}


button {

    width: 44px;
    height: 44px;

    border: none;

    border-radius: 50%;

    background:
        rgba(30,30,30,0.7);

    color: white;

    font-size: 22px;

    display: flex;

    justify-content: center;

    align-items: center;

}


/* =========================================
   読み込み表示
   ========================================= */

#loading {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    color: white;

    font-size: 16px;

    z-index: 10;
}


/* =========================================
   エラー
   ========================================= */

#error {

    display: none;

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    width: 80%;

    max-width: 500px;

    padding: 20px;

    box-sizing: border-box;

    color: white;

    background:
        rgba(180,0,0,0.8);

    border-radius: 10px;

    text-align: center;

    z-index: 40;
}

</style>

</head>


<body>


<div id="viewer">

    <div id="loading">
        写真を読み込んでいます…
    </div>

    <div id="error"></div>

    <img
        id="image"
        alt="ふなだまりの写真"
        draggable="false"
        referrerpolicy="no-referrer"
    >

</div>


<button id="closeButton">
    ×
</button>


<div id="controls">

    <button id="zoomOut">
        −
    </button>

    <button id="zoomIn">
        ＋
    </button>

    <button id="reset">
        ↺
    </button>

</div>


<script>


/* =====================================================
   URLから画像を取得
   ===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const imageURL =
    params.get("image");


const image =
    document.getElementById("image");

const viewer =
    document.getElementById("viewer");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");


/* =====================================================
   画像URL
   ===================================================== */

if (imageURL) {

    image.src = imageURL;

}
else {

    loading.style.display =
        "none";

    errorBox.style.display =
        "block";

    errorBox.textContent =
        "画像が指定されていません。";

}


/* =====================================================
   ズーム設定
   ===================================================== */

/*
 * 初期表示倍率。
 *
 * 1.00 = 画面いっぱい
 *
 * 0.90 = 少し余裕を持たせる
 *
 * iPhoneでは0.90程度がおすすめ
 */

const INITIAL_SCALE = 0.90;


const MIN_SCALE = 0.40;

const MAX_SCALE = 5.0;


let fitScale = 1;

let scale = 1;

let translateX = 0;

let translateY = 0;


/* =====================================================
   実際の表示領域を取得
   ===================================================== */

function getViewportSize() {

    /*
     * visualViewportが使える場合は
     * ブラウザが実際に表示している領域を使う。
     */

    if (window.visualViewport) {

        return {

            width:
                window.visualViewport.width,

            height:
                window.visualViewport.height

        };

    }


    return {

        width:
            window.innerWidth,

        height:
            window.innerHeight

    };

}


/* =====================================================
   viewerの高さを更新
   ===================================================== */

function updateViewerSize() {

    const vp =
        getViewportSize();


    viewer.style.width =
        vp.width + "px";


    viewer.style.height =
        vp.height + "px";

}


/* =====================================================
   初期表示倍率計算
   ===================================================== */

function calculateFitScale() {

    if (
        !image.naturalWidth ||
        !image.naturalHeight
    ) {

        return 1;

    }


    const vp =
        getViewportSize();


    const scaleX =
        vp.width /
        image.naturalWidth;


    const scaleY =
        vp.height /
        image.naturalHeight;


    /*
     * 写真全体を表示できる倍率
     */

    return Math.min(
        scaleX,
        scaleY
    );

}


/* =====================================================
   表示更新
   ===================================================== */

function updateTransform() {

    image.style.transform =

        "translate(" +

        translateX +

        "px, " +

        translateY +

        "px) " +

        "scale(" +

        (fitScale * scale) +

        ")";

}


/* =====================================================
   初期表示
   ===================================================== */

function resetView() {

    updateViewerSize();


    fitScale =
        calculateFitScale();


    /*
     * 初期表示を少し縮小
     */

    scale =
        INITIAL_SCALE;


    translateX = 0;

    translateY = 0;


    updateTransform();

}


/* =====================================================
   画像読み込み完了
   ===================================================== */

image.addEventListener(
    "load",
    function() {

        loading.style.display =
            "none";

        resetView();

    }
);


/* =====================================================
   エラー
   ===================================================== */

image.addEventListener(
    "error",
    function() {

        loading.style.display =
            "none";

        errorBox.style.display =
            "block";

        errorBox.textContent =
            "写真を読み込めませんでした。";

    }
);


/* =====================================================
   画面サイズ変更
   ===================================================== */

function handleViewportChange() {

    /*
     * 縦→横などで画面サイズが変わった場合、
     * 現在の写真の倍率を再計算する。
     */

    const oldScale =
        scale;


    updateViewerSize();


    fitScale =
        calculateFitScale();


    /*
     * まだ初期倍率なら
     * 新しい画面サイズに合わせて
     * 再配置する。
     */

    if (oldScale <= INITIAL_SCALE + 0.01) {

        scale =
            INITIAL_SCALE;

        translateX = 0;

        translateY = 0;

    }


    updateTransform();

}


/*
 * visualViewportの変化
 */

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        handleViewportChange
    );

}


/*
 * 通常のresize
 */

window.addEventListener(
    "resize",
    handleViewportChange
);


/* =====================================================
   ズーム
   ===================================================== */

function setScale(
    newScale,
    centerX,
    centerY
) {

    const oldScale =
        scale;


    scale =
        Math.min(
            Math.max(
                newScale,
                MIN_SCALE
            ),
            MAX_SCALE
        );


    /*
     * 1倍以下になったら中央へ
     */

    if (
        scale <= INITIAL_SCALE
    ) {

        scale =
            INITIAL_SCALE;

        translateX = 0;

        translateY = 0;

    }


    /*
     * ズーム中心を維持
     */

    if (
        centerX !== undefined &&
        centerY !== undefined
    ) {

        const ratio =
            scale / oldScale - 1;


        translateX -=
            (
                centerX -
                viewer.clientWidth / 2
            )
            * ratio;


        translateY -=
            (
                centerY -
                viewer.clientHeight / 2
            )
            * ratio;

    }


    updateTransform();

}


/* =====================================================
   ＋ボタン
   ===================================================== */

document
.getElementById("zoomIn")
.addEventListener(
    "click",
    function() {

        setScale(
            scale * 1.5,
            viewer.clientWidth / 2,
            viewer.clientHeight / 2
        );

    }
);


/* =====================================================
   −ボタン
   ===================================================== */

document
.getElementById("zoomOut")
.addEventListener(
    "click",
    function() {

        setScale(
            scale / 1.5,
            viewer.clientWidth / 2,
            viewer.clientHeight / 2
        );

    }
);


/* =====================================================
   リセット
   ===================================================== */

document
.getElementById("reset")
.addEventListener(
    "click",
    function() {

        resetView();

    }
);


/* =====================================================
   Pointer操作
   ===================================================== */

const pointers =
    new Map();


let lastPinchDistance =
    null;


/* =====================================================
   Pointer Down
   ===================================================== */

viewer.addEventListener(
    "pointerdown",
    function(e) {

        if (
            e.target.tagName ===
            "BUTTON"
        ) {

            return;

        }


        viewer.setPointerCapture(
            e.pointerId
        );


        pointers.set(
            e.pointerId,
            {
                x: e.clientX,
                y: e.clientY
            }
        );


        /*
         * 2本指
         */

        if (
            pointers.size === 2
        ) {

            lastPinchDistance =
                getPointerDistance();

        }

    }
);


/* =====================================================
   Pointer Move
   ===================================================== */

viewer.addEventListener(
    "pointermove",
    function(e) {

        if (
            !pointers.has(
                e.pointerId
            )
        ) {

            return;

        }


        const old =
            pointers.get(
                e.pointerId
            );


        const dx =
            e.clientX -
            old.x;


        const dy =
            e.clientY -
            old.y;


        pointers.set(
            e.pointerId,
            {
                x: e.clientX,
                y: e.clientY
            }
        );


        /*
         * 2本指
         * → ピンチズーム
         */

        if (
            pointers.size === 2
        ) {

            e.preventDefault();


            const distance =
                getPointerDistance();


            if (
                lastPinchDistance
            ) {

                const ratio =
                    distance /
                    lastPinchDistance;


                setScale(
                    scale * ratio
                );

            }


            lastPinchDistance =
                distance;


            return;

        }


        /*
         * 1本指
         * → 拡大中ならドラッグ
         */

        if (
            pointers.size === 1 &&
            scale > INITIAL_SCALE
        ) {

            e.preventDefault();


            translateX += dx;

            translateY += dy;


            updateTransform();

        }

    },
    {
        passive: false
    }
);


/* =====================================================
   Pointer Up
   ===================================================== */

viewer.addEventListener(
    "pointerup",
    function(e) {

        pointers.delete(
            e.pointerId
        );


        if (
            pointers.size < 2
        ) {

            lastPinchDistance =
                null;

        }

    }
);


/* =====================================================
   Pointer Cancel
   ===================================================== */

viewer.addEventListener(
    "pointercancel",
    function(e) {

        pointers.delete(
            e.pointerId
        );

        lastPinchDistance =
            null;

    }
);


/* =====================================================
   2本指の距離
   ===================================================== */

function getPointerDistance() {

    const values =
        Array.from(
            pointers.values()
        );


    if (
        values.length < 2
    ) {

        return 0;

    }


    const dx =
        values[0].x -
        values[1].x;


    const dy =
        values[0].y -
        values[1].y;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =====================================================
   PC：マウスホイールズーム
   ===================================================== */

viewer.addEventListener(
    "wheel",
    function(e) {

        /*
         * ブラウザのページスクロールを止める
         */

        e.preventDefault();


        /*
         * マウスポインタの位置を中心に
         * ズームする。
         */

        const rect =
            viewer.getBoundingClientRect();


        const x =
            e.clientX -
            rect.left;


        const y =
            e.clientY -
            rect.top;


        /*
         * 上へ回す → 拡大
         *
         * 下へ回す → 縮小
         */

        const zoomFactor =
            Math.exp(
                -e.deltaY * 0.002
            );


        setScale(
            scale * zoomFactor,
            x,
            y
        );

    },
    {
        passive: false
    }
);


/* =====================================================
   PC：ダブルクリック
   ===================================================== */

viewer.addEventListener(
    "dblclick",
    function(e) {

        if (
            e.target.tagName ===
            "BUTTON"
        ) {

            return;

        }


        if (
            scale <= INITIAL_SCALE
        ) {

            setScale(
                2,
                e.clientX,
                e.clientY
            );

        }
        else {

            resetView();

        }

    }
);


/* =====================================================
   閉じる
   ===================================================== */

document
.getElementById("closeButton")
.addEventListener(
    "click",
    function() {

        if (
            window.history.length > 1
        ) {

            window.history.back();

        }
        else {

            window.close();

        }

    }
);


/* =====================================================
   キーボード
   ===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "+"
            ||
            e.key === "="
        ) {

            setScale(
                scale * 1.5,
                viewer.clientWidth / 2,
                viewer.clientHeight / 2
            );

        }


        if (
            e.key === "-"
        ) {

            setScale(
                scale / 1.5,
                viewer.clientWidth / 2,
                viewer.clientHeight / 2
            );

        }


        if (
            e.key === "0"
        ) {

            resetView();

        }


        if (
            e.key === "Escape"
        ) {

            if (
                window.history.length > 1
            ) {

                window.history.back();

            }

        }

    }
);

</script>

</body>
</html>
