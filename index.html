<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=5.0,
               user-scalable=yes">

<title>画像ビューア</title>

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
    color: #fff;

    font-family: sans-serif;

    touch-action: none;
}


/* =========================================================
   Viewer
========================================================= */

#viewer {

    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #000;

    touch-action: none;
}


/* =========================================================
   Image
========================================================= */

#photo {

    position: absolute;

    left: 0;
    top: 0;

    max-width: none;
    max-height: none;

    user-select: none;
    -webkit-user-select: none;

    -webkit-user-drag: none;

    touch-action: none;

    transform-origin: 0 0;
}


/* =========================================================
   Title
========================================================= */

#title {

    position: fixed;

    left: 50%;
    top: 10px;

    transform: translateX(-50%);

    z-index: 20;

    max-width: 85%;

    padding: 6px 12px;

    background: rgba(0,0,0,0.55);

    border-radius: 5px;

    font-size: 16px;

    line-height: 1.4;

    text-align: center;

    pointer-events: none;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   Buttons
========================================================= */

.controls {

    position: fixed;

    right: 12px;
    bottom: 12px;

    z-index: 30;

    display: flex;

    gap: 8px;
}


.controlButton {

    width: 44px;
    height: 44px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,0.85);

    color: #111;

    font-size: 22px;

    line-height: 44px;

    text-align: center;

    padding: 0;

    cursor: pointer;

    user-select: none;
}


.controlButton:active {

    background: rgba(255,255,255,0.65);
}


/* =========================================================
   Close
========================================================= */

#closeButton {

    position: fixed;

    right: 12px;
    top: 10px;

    z-index: 30;

    width: 44px;
    height: 44px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,0.85);

    color: #111;

    font-size: 28px;

    line-height: 44px;

    text-align: center;

    padding: 0;

    cursor: pointer;
}


/* =========================================================
   Loading
========================================================= */

#loading {

    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 40;

    display: none;

    padding: 10px 16px;

    background: rgba(0,0,0,0.7);

    border-radius: 6px;

    font-size: 15px;
}

</style>

</head>


<body>


<div id="viewer">

    <img id="photo"
         alt="">

</div>


<div id="title"></div>


<button id="closeButton"
        class="controlButton">
    ×
</button>


<div class="controls">

    <button id="zoomOut"
            class="controlButton">
        −
    </button>

    <button id="zoomIn"
            class="controlButton">
        ＋
    </button>

    <button id="reset"
            class="controlButton">
        ↺
    </button>

</div>


<div id="loading">
    読み込み中…
</div>


<script>

/* =========================================================
   設定
========================================================= */

const INITIAL_SCALE = 0.90;

const MIN_SCALE = 0.40;

const MAX_SCALE = 5.00;

const ZOOM_STEP = 1.20;

const DOUBLE_TAP_SCALE = 2.00;

const DOUBLE_TAP_TIME = 350;

const DOUBLE_TAP_DISTANCE = 30;

const TAP_MOVE_THRESHOLD = 12;


/*
   launcherと共有するlocalStorageキー
*/

const VIEWER_STORAGE_KEY =
    "funadamariViewerRequest";


/*
   現在アクティブなviewerを示すキー
*/

const ACTIVE_VIEWER_KEY =
    "funadamariActiveViewer";


/*
   launcherからのリクエストを
   有効とみなす時間

   古いlocalStorage情報を
   誤って使用しないため。
*/

const REQUEST_VALID_TIME =
    30 * 1000;


/* =========================================================
   URL parameters
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


let imageURL =
    params.get("image") || "";


let titleText =
    params.get("title") || "";


/* =========================================================
   Viewer固有ID
========================================================= */

/*
   sessionStorageを使用することで、

   ・同じタブ → 同じID
   ・別タブ → 別ID

   となる。
*/

let VIEWER_ID = null;


try {

    VIEWER_ID =
        sessionStorage.getItem(
            "funadamariViewerId"
        );

}
catch (error) {

    VIEWER_ID = null;

}


/*
   IDがなければ新しく作る。
*/

if (!VIEWER_ID) {

    VIEWER_ID =
        Date.now().toString(36) +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 10);


    try {

        sessionStorage.setItem(
            "funadamariViewerId",
            VIEWER_ID
        );

    }
    catch (error) {

        // sessionStorageが使えなくても
        // このページ内ではVIEWER_IDを使用する。

    }

}


/* =========================================================
   HTML elements
========================================================= */

const viewer =
    document.getElementById(
        "viewer"
    );


const photo =
    document.getElementById(
        "photo"
    );


const title =
    document.getElementById(
        "title"
    );


const loading =
    document.getElementById(
        "loading"
    );


const zoomInButton =
    document.getElementById(
        "zoomIn"
    );


const zoomOutButton =
    document.getElementById(
        "zoomOut"
    );


const resetButton =
    document.getElementById(
        "reset"
    );


const closeButton =
    document.getElementById(
        "closeButton"
    );


/* =========================================================
   表示状態
========================================================= */

let fitScale = 1;

let scale = INITIAL_SCALE;

let translateX = 0;

let translateY = 0;


/* =========================================================
   Pointer state
========================================================= */

const pointers =
    new Map();


let pinchStartDistance = 0;

let pinchStartScale = 1;

let pinchCenterX = 0;

let pinchCenterY = 0;


/*
   1本指ドラッグ用
*/

let dragLastX = 0;

let dragLastY = 0;


/*
   タップ判定用
*/

let tapStartX = 0;

let tapStartY = 0;

let tapMoved = false;

let lastTapTime = 0;

let lastTapX = 0;

let lastTapY = 0;


/* =========================================================
   Viewport
========================================================= */

function getViewportSize() {

    if (window.visualViewport) {

        return {

            width:
                window.visualViewport.width,

            height:
                window.visualViewport.height

        };

    }


    return {

        width:
            window.innerWidth,

        height:
            window.innerHeight

    };

}


/* =========================================================
   fit scale
========================================================= */

function calculateFitScale() {

    if (!photo.naturalWidth ||
        !photo.naturalHeight) {

        return 1;

    }


    const viewport =
        getViewportSize();


    const widthScale =
        viewport.width /
        photo.naturalWidth;


    const heightScale =
        viewport.height /
        photo.naturalHeight;


    return Math.min(
        widthScale,
        heightScale
    );

}


/* =========================================================
   Actual scale
========================================================= */

function getActualScale() {

    return fitScale * scale;

}


/* =========================================================
   Clamp translation
========================================================= */

function clampTranslation() {

    const viewport =
        getViewportSize();


    const actualScale =
        getActualScale();


    const imageWidth =
        photo.naturalWidth *
        actualScale;


    const imageHeight =
        photo.naturalHeight *
        actualScale;


    /*
       横方向
    */

    if (imageWidth <= viewport.width) {

        translateX =
            (viewport.width -
             imageWidth) / 2;

    }
    else {

        const minX =
            viewport.width -
            imageWidth;


        if (translateX > 0) {

            translateX = 0;

        }


        if (translateX < minX) {

            translateX = minX;

        }

    }


    /*
       縦方向
    */

    if (imageHeight <= viewport.height) {

        translateY =
            (viewport.height -
             imageHeight) / 2;

    }
    else {

        const minY =
            viewport.height -
            imageHeight;


        if (translateY > 0) {

            translateY = 0;

        }


        if (translateY < minY) {

            translateY = minY;

        }

    }

}


/* =========================================================
   Apply transform
========================================================= */

function applyTransform() {

    const actualScale =
        getActualScale();


    photo.style.transform =
        "translate(" +
        translateX +
        "px, " +
        translateY +
        "px) scale(" +
        actualScale +
        ")";

}


/* =========================================================
   Reset view
========================================================= */

function resetView() {

    fitScale =
        calculateFitScale();


    scale =
        INITIAL_SCALE;


    const viewport =
        getViewportSize();


    const actualScale =
        getActualScale();


    const imageWidth =
        photo.naturalWidth *
        actualScale;


    const imageHeight =
        photo.naturalHeight *
        actualScale;


    translateX =
        (viewport.width -
         imageWidth) / 2;


    translateY =
        (viewport.height -
         imageHeight) / 2;


    clampTranslation();

    applyTransform();

}


/* =========================================================
   Set scale
========================================================= */

function setScale(
    newScale,
    centerX,
    centerY
) {

    const oldActualScale =
        getActualScale();


    newScale =
        Math.max(
            MIN_SCALE,
            Math.min(
                MAX_SCALE,
                newScale
            )
        );


    /*
       ズーム中心を維持
    */

    if (centerX !== undefined &&
        centerY !== undefined &&
        oldActualScale > 0) {

        const imageX =
            (centerX -
             translateX) /
            oldActualScale;


        const imageY =
            (centerY -
             translateY) /
            oldActualScale;


        scale =
            newScale;


        const newActualScale =
            getActualScale();


        translateX =
            centerX -
            imageX *
            newActualScale;


        translateY =
            centerY -
            imageY *
            newActualScale;

    }
    else {

        scale =
            newScale;

    }


    clampTranslation();

    applyTransform();

}


/* =========================================================
   Zoom button
========================================================= */

function zoomIn() {

    const viewport =
        getViewportSize();


    setScale(
        scale * ZOOM_STEP,
        viewport.width / 2,
        viewport.height / 2
    );

}


function zoomOut() {

    const viewport =
        getViewportSize();


    setScale(
        scale / ZOOM_STEP,
        viewport.width / 2,
        viewport.height / 2
    );

}


/* =========================================================
   Load image
========================================================= */

function loadImage(
    newImageURL,
    newTitle
) {

    if (!newImageURL) {

        return;

    }


    loading.style.display =
        "block";


    const newImage =
        new Image();


    newImage.onload =
        function () {

            imageURL =
                newImageURL;


            titleText =
                newTitle || "";


            photo.src =
                newImageURL;


            photo.alt =
                titleText;


            title.textContent =
                titleText;


            /*
               新画像に切り替えたら
               表示位置・倍率をリセット
            */

            fitScale =
                calculateFitScale();


            scale =
                INITIAL_SCALE;


            translateX = 0;

            translateY = 0;


            resetView();


            loading.style.display =
                "none";

        };


    newImage.onerror =
        function () {

            loading.style.display =
                "none";

            title.textContent =
                "画像を読み込めませんでした";

        };


    newImage.src =
        newImageURL;

}


/* =========================================================
   Active viewer registration
========================================================= */

function registerAsActiveViewer() {

    const activeInfo = {

        id:
            VIEWER_ID,

        timestamp:
            Date.now()

    };


    try {

        localStorage.setItem(
            ACTIVE_VIEWER_KEY,
            JSON.stringify(
                activeInfo
            )
        );

    }
    catch (error) {

        console.error(
            "active viewer error:",
            error
        );

    }

}


/* =========================================================
   Active viewer解除
========================================================= */

function unregisterActiveViewer() {

    try {

        const current =
            localStorage.getItem(
                ACTIVE_VIEWER_KEY
            );


        if (!current) {

            return;

        }


        const info =
            JSON.parse(current);


        if (info.id === VIEWER_ID) {

            localStorage.removeItem(
                ACTIVE_VIEWER_KEY
            );

        }

    }
    catch (error) {

        // ignore

    }

}


/* =========================================================
   このviewerがactiveか
========================================================= */

function isActiveViewer() {

    try {

        const current =
            localStorage.getItem(
                ACTIVE_VIEWER_KEY
            );


        if (!current) {

            return false;

        }


        const info =
            JSON.parse(current);


        return (
            info.id === VIEWER_ID
        );

    }
    catch (error) {

        return false;

    }

}


/* =========================================================
   launcherからのrequest確認
========================================================= */

function checkViewerRequest() {

    try {

        const raw =
            localStorage.getItem(
                VIEWER_STORAGE_KEY
            );


        if (!raw) {

            return;

        }


        const request =
            JSON.parse(raw);


        if (!request) {

            return;

        }


        /*
           古いrequestは無視
        */

        if (!request.timestamp ||
            Date.now() -
            request.timestamp >
            REQUEST_VALID_TIME) {

            return;

        }


        /*
           ★重要★

           このviewer宛てのrequestだけ
           処理する。

           targetViewerIdがないrequestは
           処理しない。
        */

        if (
            request.targetViewerId !==
            VIEWER_ID
        ) {

            return;

        }


        if (!request.image) {

            return;

        }


        /*
           自分自身がactive viewerであることを
           再確認
        */

        if (!isActiveViewer()) {

            return;

        }


        loadImage(
            request.image,
            request.title || ""
        );

    }
    catch (error) {

        console.error(
            "viewer request error:",
            error
        );

    }

}


/* =========================================================
   storage event
========================================================= */

window.addEventListener(
    "storage",
    function (event) {

        /*
           viewer request以外は無視
        */

        if (
            event.key !==
            VIEWER_STORAGE_KEY
        ) {

            return;

        }


        /*
           自分がactive viewerでなければ
           無視
        */

        if (!isActiveViewer()) {

            return;

        }


        checkViewerRequest();

    }
);


/* =========================================================
   Pointer down
========================================================= */

viewer.addEventListener(
    "pointerdown",
    function (event) {

        /*
           ボタン上では何もしない
        */

        if (
            event.target.closest("button")
        ) {

            return;

        }


        try {

            viewer.setPointerCapture(
                event.pointerId
            );

        }
        catch (error) {

            // ignore

        }


        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );


        tapStartX =
            event.clientX;


        tapStartY =
            event.clientY;


        tapMoved =
            false;


        /*
           1本指
        */

        if (pointers.size === 1) {

            dragLastX =
                event.clientX;


            dragLastY =
                event.clientY;

        }


        /*
           2本指になった
        */

        if (pointers.size === 2) {

            const values =
                Array.from(
                    pointers.values()
                );


            const p1 =
                values[0];


            const p2 =
                values[1];


            const dx =
                p2.x - p1.x;


            const dy =
                p2.y - p1.y;


            pinchStartDistance =
                Math.hypot(
                    dx,
                    dy
                );


            pinchStartScale =
                scale;


            pinchCenterX =
                (p1.x + p2.x) / 2;


            pinchCenterY =
                (p1.y + p2.y) / 2;

        }

    }
);


/* =========================================================
   Pointer move
========================================================= */

viewer.addEventListener(
    "pointermove",
    function (event) {

        if (
            event.target.closest("button")
        ) {

            return;

        }


        if (!pointers.has(
            event.pointerId
        )) {

            return;

        }


        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );


        /*
           2本指：pinch
        */

        if (pointers.size === 2) {

            const values =
                Array.from(
                    pointers.values()
                );


            const p1 =
                values[0];


            const p2 =
                values[1];


            const dx =
                p2.x - p1.x;


            const dy =
                p2.y - p1.y;


            const distance =
                Math.hypot(
                    dx,
                    dy
                );


            if (pinchStartDistance > 0) {

                const newScale =
                    pinchStartScale *
                    (
                        distance /
                        pinchStartDistance
                    );


                setScale(
                    newScale,
                    pinchCenterX,
                    pinchCenterY
                );

            }


            tapMoved =
                true;


            return;

        }


        /*
           1本指：drag
        */

        if (pointers.size === 1) {

            const dx =
                event.clientX -
                dragLastX;


            const dy =
                event.clientY -
                dragLastY;


            if (
                Math.abs(
                    event.clientX -
                    tapStartX
                ) >
                TAP_MOVE_THRESHOLD ||
                Math.abs(
                    event.clientY -
                    tapStartY
                ) >
                TAP_MOVE_THRESHOLD
            ) {

                tapMoved =
                    true;

            }


            /*
               ズームされている場合、
               または画像サイズがviewportより
               大きい場合に移動
            */

            translateX += dx;

            translateY += dy;


            clampTranslation();

            applyTransform();


            dragLastX =
                event.clientX;


            dragLastY =
                event.clientY;

        }

    }
);


/* =========================================================
   Pointer up
========================================================= */

viewer.addEventListener(
    "pointerup",
    function (event) {

        if (
            event.target.closest("button")
        ) {

            return;

        }


        const wasOnePointer =
            pointers.size === 1;


        const pointerX =
            event.clientX;


        const pointerY =
            event.clientY;


        pointers.delete(
            event.pointerId
        );


        /*
           2本指pinch終了後、
           1本指が残っている場合
        */

        if (
            wasOnePointer === false &&
            pointers.size === 1
        ) {

            const remaining =
                Array.from(
                    pointers.values()
                )[0];


            /*
               ★重要★

               残った指の位置を
               dragの基準位置にする。

               これによりpinch終了直後に
               画像がジャンプしない。
            */

            dragLastX =
                remaining.x;


            dragLastY =
                remaining.y;


            tapMoved =
                true;


            return;

        }


        /*
           1本指のtap判定
        */

        if (
            pointers.size === 0 &&
            wasOnePointer &&
            !tapMoved
        ) {

            const now =
                Date.now();


            const distance =
                Math.hypot(
                    pointerX -
                    lastTapX,
                    pointerY -
                    lastTapY
                );


            if (
                now -
                lastTapTime <=
                DOUBLE_TAP_TIME &&
                distance <=
                DOUBLE_TAP_DISTANCE
            ) {

                /*
                   double tap
                */

                if (
                    Math.abs(
                        scale -
                        DOUBLE_TAP_SCALE
                    ) < 0.01
                ) {

                    setScale(
                        INITIAL_SCALE,
                        pointerX,
                        pointerY
                    );

                }
                else {

                    setScale(
                        DOUBLE_TAP_SCALE,
                        pointerX,
                        pointerY
                    );

                }


                lastTapTime = 0;

            }
            else {

                lastTapTime =
                    now;

                lastTapX =
                    pointerX;

                lastTapY =
                    pointerY;

            }

        }

    }
);


/* =========================================================
   Pointer cancel
========================================================= */

viewer.addEventListener(
    "pointercancel",
    function (event) {

        pointers.delete(
            event.pointerId
        );

    }
);


/* =========================================================
   PC double click
========================================================= */

viewer.addEventListener(
    "dblclick",
    function (event) {

        if (
            event.target.closest("button")
        ) {

            return;

        }


        if (
            Math.abs(
                scale -
                DOUBLE_TAP_SCALE
            ) < 0.01
        ) {

            setScale(
                INITIAL_SCALE,
                event.clientX,
                event.clientY
            );

        }
        else {

            setScale(
                DOUBLE_TAP_SCALE,
                event.clientX,
                event.clientY
            );

        }

    }
);


/* =========================================================
   Mouse wheel zoom
========================================================= */

viewer.addEventListener(
    "wheel",
    function (event) {

        event.preventDefault();


        const factor =
            event.deltaY < 0
                ? ZOOM_STEP
                : 1 / ZOOM_STEP;


        setScale(
            scale * factor,
            event.clientX,
            event.clientY
        );

    },
    {
        passive: false
    }
);


/* =========================================================
   Buttons
========================================================= */

zoomInButton.addEventListener(
    "click",
    function (event) {

        event.stopPropagation();

        zoomIn();

    }
);


zoomOutButton.addEventListener(
    "click",
    function (event) {

        event.stopPropagation();

        zoomOut();

    }
);


resetButton.addEventListener(
    "click",
    function (event) {

        event.stopPropagation();

        resetView();

    }
);


/* =========================================================
   Close button
========================================================= */

closeButton.addEventListener(
    "click",
    function (event) {

        event.stopPropagation();


        unregisterActiveViewer();


        try {

            window.close();

        }
        catch (error) {

            // ignore

        }

    }
);


/* =========================================================
   Viewport change
========================================================= */

function handleViewportChange() {

    if (!photo.naturalWidth) {

        return;

    }


    /*
       現在の相対倍率を保存
    */

    const oldFitScale =
        fitScale;


    const relativeScale =
        scale;


    /*
       新しいfitScale
    */

    fitScale =
        calculateFitScale();


    /*
       fitScaleの変更によって
       actual scaleを維持する。
    */

    if (oldFitScale > 0) {

        scale =
            (
                oldFitScale *
                relativeScale
            ) /
            fitScale;

    }


    clampTranslation();

    applyTransform();

}


window.addEventListener(
    "resize",
    handleViewportChange
);


if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        handleViewportChange
    );

}


/* =========================================================
   Context menu
========================================================= */

viewer.addEventListener(
    "contextmenu",
    function (event) {

        event.preventDefault();

    }
);


/* =========================================================
   Page visibility
========================================================= */

document.addEventListener(
    "visibilitychange",
    function () {

        /*
           viewerが再び表示されたら、
           自分をactive viewerとして登録する。

           Google Sitesに戻ってから
           viewerへ戻った場合にも有効。
        */

        if (
            document.visibilityState ===
            "visible"
        ) {

            registerAsActiveViewer();

        }

    }
);


/* =========================================================
   Page hide
========================================================= */

window.addEventListener(
    "pagehide",
    function () {

        unregisterActiveViewer();

    }
);


/* =========================================================
   初期画像
========================================================= */

function initializeViewer() {

    /*
       まず現在のviewerをactiveにする。
    */

    registerAsActiveViewer();


    /*
       URLから指定された画像があれば
       それを表示。
    */

    if (imageURL) {

        loadImage(
            imageURL,
            titleText
        );

    }

}


/* =========================================================
   Start
========================================================= */

initializeViewer();

</script>

</body>

</html>
