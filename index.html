<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               height=device-height,
               initial-scale=1.0,
               maximum-scale=5.0,
               user-scalable=yes,
               viewport-fit=cover">

<title>Photo Viewer</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: sans-serif;

    touch-action: none;
}


#viewer {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    touch-action: none;
}


/* ------------------------------------------
   写真
------------------------------------------ */

#image {

    position: absolute;

    left: 50%;
    top: 50%;

    max-width: none;
    max-height: none;

    transform-origin: center center;

    user-select: none;
    -webkit-user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;
}


/* ------------------------------------------
   タイトル
------------------------------------------ */

#title {

    position: fixed;

    top: max(10px, env(safe-area-inset-top));

    left: max(12px, env(safe-area-inset-left));

    max-width:
        calc(100vw - 80px);

    padding: 7px 12px;

    color: white;

    background:
        rgba(0, 0, 0, 0.55);

    border-radius: 6px;

    font-size: 17px;

    line-height: 1.4;

    z-index: 20;

    display: none;

    pointer-events: none;

    text-shadow:
        0 1px 2px rgba(0,0,0,0.8);
}


/* ------------------------------------------
   閉じるボタン
------------------------------------------ */

#closeButton {

    position: fixed;

    top: max(10px, env(safe-area-inset-top));

    right: max(10px, env(safe-area-inset-right));

    width: 42px;
    height: 42px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background:
        rgba(0,0,0,0.55);

    color: white;

    font-size: 25px;

    line-height: 42px;

    text-align: center;

    z-index: 30;

    cursor: pointer;

    touch-action: manipulation;
}


#closeButton:active {

    background:
        rgba(255,255,255,0.35);
}


/* ------------------------------------------
   操作ボタン
------------------------------------------ */

#controls {

    position: fixed;

    bottom:
        max(12px, env(safe-area-inset-bottom));

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    gap: 8px;

    z-index: 30;
}


#controls button {

    width: 42px;
    height: 42px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background:
        rgba(0,0,0,0.55);

    color: white;

    font-size: 20px;

    cursor: pointer;

    touch-action: manipulation;
}


#controls button:active {

    background:
        rgba(255,255,255,0.35);
}

</style>

</head>


<body>


<div id="viewer">


    <div id="title"></div>


    <img
        id="image"
        draggable="false"
        alt=""
    >


    <button
        id="closeButton"
        aria-label="閉じる">
        ×
    </button>


    <div id="controls">

        <button
            id="zoomOut"
            aria-label="縮小">
            −
        </button>

        <button
            id="reset"
            aria-label="初期表示">
            ↺
        </button>

        <button
            id="zoomIn"
            aria-label="拡大">
            ＋
        </button>

    </div>


</div>


<script>


// ==================================================
// URLパラメータ
// ==================================================

const params =
    new URLSearchParams(
        window.location.search
    );


const imageUrl =
    params.get("image");


const titleText =
    params.get("title");


// ==================================================
// DOM
// ==================================================

const viewer =
    document.getElementById("viewer");

const image =
    document.getElementById("image");

const title =
    document.getElementById("title");


// ==================================================
// タイトル
// ==================================================

if (titleText) {

    title.textContent =
        titleText;

    title.style.display =
        "block";
}


// ==================================================
// 画像URL
// ==================================================

if (imageUrl) {

    image.src =
        imageUrl;

}
else {

    title.textContent =
        "画像URLが指定されていません";

    title.style.display =
        "block";
}


// ==================================================
// ズーム設定
// ==================================================
//
// fitScale
//   = 画像を画面いっぱいに収めるための倍率
//
// scale
//   = fitScaleに対する相対倍率
//
// 例：
//
// scale = 0.9
// → fitScaleの90%
//
// scale = 1.0
// → fitScaleと同じ
//
// scale = 2.0
// → fitScaleの2倍
//
// ==================================================


const INITIAL_SCALE = 0.90;

const MIN_SCALE = 0.40;

const MAX_SCALE = 5.0;


let fitScale = 1.0;

let scale = INITIAL_SCALE;


let translateX = 0;

let translateY = 0;


// ==================================================
// ビューポートサイズ
// ==================================================

function getViewportSize() {

    if (window.visualViewport) {

        return {

            width:
                window.visualViewport.width,

            height:
                window.visualViewport.height

        };

    }


    return {

        width:
            window.innerWidth,

        height:
            window.innerHeight

    };

}


// ==================================================
// Fit倍率計算
// ==================================================

function calculateFitScale() {

    const viewport =
        getViewportSize();


    const vw =
        viewport.width;

    const vh =
        viewport.height;


    const iw =
        image.naturalWidth;

    const ih =
        image.naturalHeight;


    if (!iw || !ih) {

        fitScale = 1;

        return;

    }


    const scaleX =
        vw / iw;

    const scaleY =
        vh / ih;


    // 画像全体が画面内に入る倍率

    fitScale =
        Math.min(
            scaleX,
            scaleY
        );

}


// ==================================================
// 画像更新
// ==================================================

function updateImage() {

    const actualScale =
        fitScale * scale;


    image.style.width =
        image.naturalWidth + "px";

    image.style.height =
        image.naturalHeight + "px";


    image.style.transform =
        "translate(-50%, -50%) " +
        "translate(" +
            translateX +
            "px, " +
            translateY +
            "px" +
        ") " +
        "scale(" +
            actualScale +
        ")";

}


// ==================================================
// 初期表示
// ==================================================

function resetView() {

    calculateFitScale();


    scale =
        INITIAL_SCALE;


    translateX =
        0;

    translateY =
        0;


    updateImage();

}


// ==================================================
// ズーム変更
// ==================================================

function setScale(
    newScale,
    centerX,
    centerY
) {


    newScale =
        Math.max(
            MIN_SCALE,
            Math.min(
                MAX_SCALE,
                newScale
            )
        );


    if (newScale === scale) {

        return;

    }


    const oldActualScale =
        fitScale * scale;


    const newActualScale =
        fitScale * newScale;


    // 中心位置が指定されていない場合は画面中央

    if (
        centerX === undefined ||
        centerY === undefined
    ) {

        const viewport =
            getViewportSize();


        centerX =
            viewport.width / 2;

        centerY =
            viewport.height / 2;

    }


    const imageCenterX =
        getViewportSize().width / 2
        + translateX;


    const imageCenterY =
        getViewportSize().height / 2
        + translateY;


    const dx =
        centerX - imageCenterX;


    const dy =
        centerY - imageCenterY;


    const ratio =
        newActualScale /
        oldActualScale;


    // ズーム中心を維持

    translateX -=
        dx * (ratio - 1);


    translateY -=
        dy * (ratio - 1);


    scale =
        newScale;


    // 初期表示以下になった場合は
    // 中央位置に戻す

    if (scale <= INITIAL_SCALE) {

        translateX = 0;

        translateY = 0;

    }


    updateImage();

}


// ==================================================
// 画像ロード完了
// ==================================================

image.addEventListener(
    "load",
    () => {

        resetView();

    }
);


// ==================================================
// PC：マウスホイール
// ==================================================

viewer.addEventListener(
    "wheel",
    (event) => {

        event.preventDefault();


        const rect =
            viewer.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        const zoomFactor =
            event.deltaY < 0
                ? 1.15
                : 1 / 1.15;


        setScale(
            scale * zoomFactor,
            x,
            y
        );

    },
    {
        passive: false
    }
);


// ==================================================
// ＋ボタン
// ==================================================

document
    .getElementById("zoomIn")
    .addEventListener(
        "click",
        () => {

            setScale(
                scale * 1.25
            );

        }
    );


// ==================================================
// −ボタン
// ==================================================

document
    .getElementById("zoomOut")
    .addEventListener(
        "click",
        () => {

            setScale(
                scale / 1.25
            );

        }
    );


// ==================================================
// リセット
// ==================================================

document
    .getElementById("reset")
    .addEventListener(
        "click",
        () => {

            resetView();

        }
    );


// ==================================================
// 閉じる
// ==================================================

document
    .getElementById("closeButton")
    .addEventListener(
        "click",
        () => {

            if (
                window.history.length > 1
            ) {

                window.history.back();

            }
            else {

                window.close();

            }

        }
    );


// ==================================================
// ダブルクリック
// ==================================================

viewer.addEventListener(
    "dblclick",
    (event) => {


        const rect =
            viewer.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        if (
            scale <= INITIAL_SCALE
        ) {

            setScale(
                2.0,
                x,
                y
            );

        }
        else {

            resetView();

        }

    }
);


// ==================================================
// Pointer Events
// ==================================================

const pointers =
    new Map();


let lastPinchDistance =
    null;


let lastPointerX =
    0;


let lastPointerY =
    0;


// ==================================================
// 2点間距離
// ==================================================

function getDistance(
    p1,
    p2
) {

    const dx =
        p1.clientX -
        p2.clientX;


    const dy =
        p1.clientY -
        p2.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


// ==================================================
// Pointer Down
// ==================================================

viewer.addEventListener(
    "pointerdown",
    (event) => {


        viewer.setPointerCapture(
            event.pointerId
        );


        pointers.set(
            event.pointerId,
            event
        );


        lastPointerX =
            event.clientX;


        lastPointerY =
            event.clientY;


        if (
            pointers.size === 2
        ) {

            const pts =
                Array.from(
                    pointers.values()
                );


            lastPinchDistance =
                getDistance(
                    pts[0],
                    pts[1]
                );

        }

    }
);


// ==================================================
// Pointer Move
// ==================================================

viewer.addEventListener(
    "pointermove",
    (event) => {


        if (
            !pointers.has(
                event.pointerId
            )
        ) {

            return;

        }


        pointers.set(
            event.pointerId,
            event
        );


        // --------------------------------------
        // 2本指
        // --------------------------------------

        if (
            pointers.size === 2
        ) {


            const pts =
                Array.from(
                    pointers.values()
                );


            const currentDistance =
                getDistance(
                    pts[0],
                    pts[1]
                );


            if (
                lastPinchDistance !== null &&
                lastPinchDistance > 0
            ) {


                const factor =
                    currentDistance /
                    lastPinchDistance;


                const centerX =
                    (
                        pts[0].clientX +
                        pts[1].clientX
                    ) / 2;


                const centerY =
                    (
                        pts[0].clientY +
                        pts[1].clientY
                    ) / 2;


                setScale(
                    scale * factor,
                    centerX,
                    centerY
                );

            }


            lastPinchDistance =
                currentDistance;


            return;

        }


        // --------------------------------------
        // 1本指ドラッグ
        // --------------------------------------

        if (
            pointers.size === 1 &&
            scale > INITIAL_SCALE
        ) {


            const dx =
                event.clientX -
                lastPointerX;


            const dy =
                event.clientY -
                lastPointerY;


            translateX +=
                dx;


            translateY +=
                dy;


            updateImage();

        }


        lastPointerX =
            event.clientX;


        lastPointerY =
            event.clientY;

    }
);


// ==================================================
// Pointer Up
// ==================================================

viewer.addEventListener(
    "pointerup",
    (event) => {


        pointers.delete(
            event.pointerId
        );


        if (
            pointers.size < 2
        ) {

            lastPinchDistance =
                null;

        }

    }
);


// ==================================================
// Pointer Cancel
// ==================================================

viewer.addEventListener(
    "pointercancel",
    (event) => {


        pointers.delete(
            event.pointerId
        );


        if (
            pointers.size < 2
        ) {

            lastPinchDistance =
                null;

        }

    }
);


// ==================================================
// 画面サイズ変更
// ==================================================

function handleViewportChange() {


    // 現在の倍率を維持したまま
    // fitScaleだけ再計算する


    calculateFitScale();


    // 画面回転時などに写真が画面外へ
    // 大きく移動してしまわないよう中央へ戻す

    translateX = 0;

    translateY = 0;


    updateImage();

}


// ==================================================
// Window resize
// ==================================================

window.addEventListener(
    "resize",
    () => {

        handleViewportChange();

    }
);


// ==================================================
// Visual Viewport
// ==================================================

if (
    window.visualViewport
) {

    window.visualViewport.addEventListener(
        "resize",
        () => {

            handleViewportChange();

        }
    );

}


// ==================================================
// 初期化
// ==================================================

window.addEventListener(
    "load",
    () => {


        if (
            image.complete &&
            image.naturalWidth
        ) {

            resetView();

        }

    }
);


</script>

</body>
</html>
