<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Photo Viewer</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: sans-serif;
}

/* --------------------------------
   Viewer
-------------------------------- */

#viewer {
    position: fixed;
    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #000;

    touch-action: none;

    cursor: default;
}

/* --------------------------------
   Image
-------------------------------- */

#photo {
    position: absolute;

    left: 50%;
    top: 50%;

    transform-origin: center center;

    user-select: none;
    -webkit-user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;

    will-change: transform;

    max-width: none;
    max-height: none;
}

/* --------------------------------
   Title
-------------------------------- */

#title {
    position: fixed;

    top: calc(10px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));

    z-index: 20;

    max-width: calc(100vw - 90px);

    padding: 6px 10px;

    color: white;

    background: rgba(0, 0, 0, 0.55);

    border-radius: 5px;

    font-size: 15px;
    line-height: 1.4;

    box-sizing: border-box;

    display: none;

    pointer-events: none;
}

/* --------------------------------
   Controls
-------------------------------- */

#controls {

    position: fixed;

    left: 50%;

    bottom: calc(15px + env(safe-area-inset-bottom));

    transform: translateX(-50%);

    z-index: 30;

    display: flex;

    gap: 8px;

    padding: 6px 8px;

    background: rgba(0, 0, 0, 0.45);

    border-radius: 10px;

    user-select: none;
    -webkit-user-select: none;

    touch-action: manipulation;
}

#controls button {

    width: 44px;
    height: 40px;

    border: none;

    border-radius: 6px;

    background: rgba(255,255,255,0.85);

    color: #111;

    font-size: 22px;

    line-height: 40px;

    padding: 0;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;

    touch-action: manipulation;
}

#controls button:active {

    background: rgba(255,255,255,0.60);
}

/* --------------------------------
   Close button
-------------------------------- */

#close {

    position: fixed;

    right: calc(10px + env(safe-area-inset-right));

    top: calc(10px + env(safe-area-inset-top));

    z-index: 30;

    width: 42px;
    height: 42px;

    border: none;

    border-radius: 50%;

    background: rgba(0,0,0,0.55);

    color: white;

    font-size: 28px;

    line-height: 42px;

    padding: 0;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;

    touch-action: manipulation;
}

/* --------------------------------
   Loading
-------------------------------- */

#loading {

    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 10;

    color: white;

    font-size: 16px;

    display: none;

    pointer-events: none;
}

</style>
</head>


<body>

<div id="viewer">

    <div id="loading">読み込み中...</div>

    <div id="title"></div>

    <img id="photo" draggable="false">

    <button id="close" type="button">×</button>

    <div id="controls">

        <button id="zoomOut" type="button">−</button>

        <button id="zoomIn" type="button">＋</button>

        <button id="reset" type="button">↺</button>

    </div>

</div>


<script>

/* =========================================================
   URL parameters
========================================================= */

const params = new URLSearchParams(window.location.search);

const imageURL = params.get("image");
const titleText = params.get("title");


/* =========================================================
   Elements
========================================================= */

const viewer   = document.getElementById("viewer");
const photo    = document.getElementById("photo");
const title    = document.getElementById("title");
const loading  = document.getElementById("loading");

const zoomInButton  = document.getElementById("zoomIn");
const zoomOutButton = document.getElementById("zoomOut");
const resetButton   = document.getElementById("reset");
const closeButton   = document.getElementById("close");


/* =========================================================
   Settings
========================================================= */

/*
   INITIAL_SCALE

   画面に収まる最大サイズを100%とした場合、
   最初は90%で表示します。
*/

const INITIAL_SCALE = 0.90;


/*
   ダブルクリック／ダブルタップ時の拡大率
*/

const DOUBLE_TAP_SCALE = 2.00;


/*
   最小・最大倍率

   0.40 = fitScaleの40%
   5.00 = fitScaleの500%
*/

const MIN_SCALE = 0.40;
const MAX_SCALE = 5.00;


/*
   ＋／−ボタンおよびホイールの倍率変更量
*/

const ZOOM_STEP = 1.20;


/*
   ダブルタップ判定
*/

const DOUBLE_TAP_TIME = 350;

const DOUBLE_TAP_DISTANCE = 30;


/*
   1本指ドラッグとタップを区別する移動距離
*/

const TAP_MOVE_THRESHOLD = 12;


/* =========================================================
   State
========================================================= */


/*
   fitScale

   画像を画面内に完全に収める倍率
*/

let fitScale = 1;


/*
   scale

   fitScaleを1.0とした相対倍率

   0.90 → 初期表示
   2.00 → fitScaleの2倍
*/

let scale = INITIAL_SCALE;


/*
   画像の移動量
*/

let translateX = 0;
let translateY = 0;


/*
   ポインター管理

   PCマウス
   スマートフォンの指
*/

const pointers = new Map();


/*
   1本指ドラッグ用
*/

let dragLastX = 0;
let dragLastY = 0;


/*
   ピンチ用
*/

let pinchStartDistance = 0;
let pinchStartScale = 1;


/*
   タップ候補

   ダブルタップ判定に使用
*/

let tapStartX = 0;
let tapStartY = 0;
let tapStartTime = 0;
let tapMoved = false;


/*
   前回のタップ

   ダブルタップ判定に使用
*/

let lastTapTime = 0;
let lastTapX = 0;
let lastTapY = 0;


/* =========================================================
   Image URL
========================================================= */

if (!imageURL) {

    loading.style.display = "block";

    loading.textContent =
        "画像URLが指定されていません。";

} else {

    photo.src = imageURL;

}


/* =========================================================
   Title
========================================================= */

if (titleText) {

    title.textContent = titleText;

    title.style.display = "block";

}


/* =========================================================
   Image loaded
========================================================= */

photo.addEventListener("load", function () {

    loading.style.display = "none";

    calculateFitScale();

    resetView();

});


photo.addEventListener("error", function () {

    loading.style.display = "block";

    loading.textContent =
        "画像を読み込めませんでした。";

});


/* =========================================================
   Calculate fit scale
========================================================= */

function calculateFitScale() {

    if (!photo.naturalWidth || !photo.naturalHeight) {

        return;

    }


    let viewportWidth;
    let viewportHeight;


    /*
       visualViewportが使用可能なら使用する。

       iPhone Safari / Chromeのアドレスバーによる
       viewport変化にも対応しやすくする。
    */

    if (window.visualViewport) {

        viewportWidth  = window.visualViewport.width;
        viewportHeight = window.visualViewport.height;

    } else {

        viewportWidth  = window.innerWidth;
        viewportHeight = window.innerHeight;

    }


    const widthRatio =
        viewportWidth / photo.naturalWidth;

    const heightRatio =
        viewportHeight / photo.naturalHeight;


    /*
       画像全体が画面内に入る倍率
    */

    fitScale = Math.min(
        widthRatio,
        heightRatio
    );

}


/* =========================================================
   Apply image transform
========================================================= */

function updateImage() {

    if (!photo.naturalWidth) {

        return;

    }


    const actualScale =
        fitScale * scale;


    const width =
        photo.naturalWidth * actualScale;

    const height =
        photo.naturalHeight * actualScale;


    photo.style.width =
        photo.naturalWidth + "px";

    photo.style.height =
        photo.naturalHeight + "px";


    photo.style.transform =
        "translate(-50%, -50%) " +
        "translate(" +
        translateX + "px, " +
        translateY + "px) " +
        "scale(" +
        actualScale +
        ")";

}


/* =========================================================
   Clamp translation
========================================================= */

function clampTranslation() {

    if (!photo.naturalWidth) {

        return;

    }


    let viewportWidth;
    let viewportHeight;


    if (window.visualViewport) {

        viewportWidth =
            window.visualViewport.width;

        viewportHeight =
            window.visualViewport.height;

    } else {

        viewportWidth =
            window.innerWidth;

        viewportHeight =
            window.innerHeight;

    }


    const actualScale =
        fitScale * scale;


    const imageWidth =
        photo.naturalWidth * actualScale;

    const imageHeight =
        photo.naturalHeight * actualScale;


    /*
       横方向
    */

    if (imageWidth <= viewportWidth) {

        translateX = 0;

    } else {

        const maxX =
            (imageWidth - viewportWidth) / 2;

        translateX =
            Math.max(
                -maxX,
                Math.min(maxX, translateX)
            );

    }


    /*
       縦方向
    */

    if (imageHeight <= viewportHeight) {

        translateY = 0;

    } else {

        const maxY =
            (imageHeight - viewportHeight) / 2;

        translateY =
            Math.max(
                -maxY,
                Math.min(maxY, translateY)
            );

    }

}


/* =========================================================
   Set scale
========================================================= */

function setScale(
    newScale,
    centerX = window.innerWidth / 2,
    centerY = window.innerHeight / 2
) {

    if (!photo.naturalWidth) {

        return;

    }


    /*
       倍率を制限
    */

    newScale =
        Math.max(
            MIN_SCALE,
            Math.min(MAX_SCALE, newScale)
        );


    const oldActualScale =
        fitScale * scale;

    const newActualScale =
        fitScale * newScale;


    /*
       拡大・縮小の中心を維持する。

       画面中央以外をクリックして
       ホイールズームした場合でも、
       その位置を中心に拡大する。
    */

    const imageCenterX =
        window.innerWidth / 2 + translateX;

    const imageCenterY =
        window.innerHeight / 2 + translateY;


    const relativeX =
        centerX - imageCenterX;

    const relativeY =
        centerY - imageCenterY;


    if (oldActualScale !== 0) {

        translateX =
            centerX -
            window.innerWidth / 2 -
            relativeX *
            (newActualScale / oldActualScale);

        translateY =
            centerY -
            window.innerHeight / 2 -
            relativeY *
            (newActualScale / oldActualScale);

    }


    scale = newScale;


    /*
       初期表示以下では画像を中央に戻す。
    */

    if (scale <= INITIAL_SCALE) {

        scale = INITIAL_SCALE;

        translateX = 0;
        translateY = 0;

    }


    clampTranslation();

    updateImage();

}


/* =========================================================
   Reset view
========================================================= */

function resetView() {

    scale = INITIAL_SCALE;

    translateX = 0;
    translateY = 0;

    updateImage();

}


/* =========================================================
   Button controls
========================================================= */


/*
   ＋
*/

zoomInButton.addEventListener("click", function (event) {

    event.stopPropagation();

    setScale(
        scale * ZOOM_STEP,
        window.innerWidth / 2,
        window.innerHeight / 2
    );

});


/*
   −
*/

zoomOutButton.addEventListener("click", function (event) {

    event.stopPropagation();

    setScale(
        scale / ZOOM_STEP,
        window.innerWidth / 2,
        window.innerHeight / 2
    );

});


/*
   ↺
*/

resetButton.addEventListener("click", function (event) {

    event.stopPropagation();

    resetView();

});


/* =========================================================
   Prevent button pointer events from reaching viewer
========================================================= */

document
    .querySelectorAll("#controls button, #close")
    .forEach(function (button) {

        button.addEventListener(
            "pointerdown",
            function (event) {

                event.stopPropagation();

            }
        );

        button.addEventListener(
            "pointermove",
            function (event) {

                event.stopPropagation();

            }
        );

        button.addEventListener(
            "pointerup",
            function (event) {

                event.stopPropagation();

            }
        );

    });


/* =========================================================
   Close button
========================================================= */

closeButton.addEventListener("click", function (event) {

    event.stopPropagation();


    /*
       Google Sites等から呼び出した場合、
       history.back()で元ページへ戻る。
    */

    if (window.history.length > 1) {

        window.history.back();

    } else {

        window.close();

    }

});


/* =========================================================
   Pointer Down
========================================================= */

viewer.addEventListener(
    "pointerdown",
    function (event) {

        /*
           ボタン上では何もしない
        */

        if (event.target.closest("button")) {

            return;

        }


        /*
           ポインターを登録
        */

        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );


        /*
           Pointer Capture

           指やマウスがviewerの外へ出ても
           操作を継続できる。
        */

        try {

            viewer.setPointerCapture(
                event.pointerId
            );

        } catch (e) {
            // ignore
        }


        /*
           1本目の指／マウス
        */

        if (pointers.size === 1) {

            dragLastX = event.clientX;
            dragLastY = event.clientY;


            /*
               ダブルタップ候補として記録
            */

            tapStartX = event.clientX;
            tapStartY = event.clientY;

            tapStartTime = performance.now();

            tapMoved = false;

        }


        /*
           2本になった場合は
           ピンチ操作開始。
        */

        if (pointers.size === 2) {

            /*
               ダブルタップ候補をキャンセル
            */

            tapMoved = true;


            const values =
                Array.from(pointers.values());


            pinchStartDistance =
                distance(
                    values[0],
                    values[1]
                );


            pinchStartScale =
                scale;


            /*
               ピンチ終了後の1本指ドラッグが
               飛ばないようにするため、
               後で残った指の位置を基準に
               ドラッグを再設定する。
            */

        }

    }
);


/* =========================================================
   Pointer Move
========================================================= */

viewer.addEventListener(
    "pointermove",
    function (event) {

        if (!pointers.has(event.pointerId)) {

            return;

        }


        /*
           現在位置を更新
        */

        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );


        /*
           2本指 → ピンチ
        */

        if (pointers.size === 2) {

            tapMoved = true;


            const values =
                Array.from(pointers.values());


            const currentDistance =
                distance(
                    values[0],
                    values[1]
                );


            if (pinchStartDistance > 0) {

                const ratio =
                    currentDistance /
                    pinchStartDistance;


                const newScale =
                    pinchStartScale * ratio;


                /*
                   ピンチの中心
                */

                const centerX =
                    (
                        values[0].x +
                        values[1].x
                    ) / 2;

                const centerY =
                    (
                        values[0].y +
                        values[1].y
                    ) / 2;


                setScale(
                    newScale,
                    centerX,
                    centerY
                );

            }


            return;

        }


        /*
           1本指
        */

        if (pointers.size === 1) {

            /*
               タップ判定用の移動量
            */

            const dx =
                event.clientX - tapStartX;

            const dy =
                event.clientY - tapStartY;

            const movedDistance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                movedDistance >
                TAP_MOVE_THRESHOLD
            ) {

                tapMoved = true;

            }


            /*
               拡大されている場合のみ
               1本指ドラッグを有効にする。
            */

            if (
                scale > INITIAL_SCALE &&
                tapMoved
            ) {

                const moveX =
                    event.clientX -
                    dragLastX;

                const moveY =
                    event.clientY -
                    dragLastY;


                translateX += moveX;

                translateY += moveY;


                clampTranslation();

                updateImage();

            }


            /*
               次回のドラッグ基準位置を
               必ず現在位置に更新する。
            */

            dragLastX = event.clientX;
            dragLastY = event.clientY;

        }

    }
);


/* =========================================================
   Pointer Up
========================================================= */

viewer.addEventListener(
    "pointerup",
    function (event) {

        if (!pointers.has(event.pointerId)) {

            return;

        }


        const releasedX =
            event.clientX;

        const releasedY =
            event.clientY;


        /*
           現在のポインターを削除する前に
           本数を確認する。
        */

        const wasTwoFinger =
            pointers.size >= 2;


        pointers.delete(event.pointerId);


        /*
           Pointer Capture解除
        */

        try {

            viewer.releasePointerCapture(
                event.pointerId
            );

        } catch (e) {
            // ignore
        }


        /*
           ピンチ終了後
           1本の指が残った場合。
        */

        if (
            wasTwoFinger &&
            pointers.size === 1
        ) {

            const remaining =
                Array.from(
                    pointers.values()
                )[0];


            /*
               ここが重要。

               ピンチ中に移動した距離を
               ドラッグの開始位置として
               新たに設定する。

               これにより、ピンチ終了直後に
               1本指でドラッグしても画像が
               突然ジャンプしない。
            */

            dragLastX =
                remaining.x;

            dragLastY =
                remaining.y;


            /*
               ピンチ後なので、
               残った指はタップとはみなさない。
            */

            tapMoved = true;


            return;

        }


        /*
           1本指が完全に離れた場合
        */

        if (pointers.size === 0) {

            /*
               タップとして成立するか判定
            */

            const now =
                performance.now();


            const duration =
                now - tapStartTime;


            const dx =
                releasedX - tapStartX;

            const dy =
                releasedY - tapStartY;

            const movedDistance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            const isTap =
                !tapMoved &&
                duration <= DOUBLE_TAP_TIME &&
                movedDistance <= TAP_MOVE_THRESHOLD;


            if (isTap) {

                /*
                   前回のタップとの間隔
                */

                const tapInterval =
                    now - lastTapTime;


                const tapDistance =
                    Math.sqrt(
                        Math.pow(
                            releasedX - lastTapX,
                            2
                        ) +
                        Math.pow(
                            releasedY - lastTapY,
                            2
                        )
                    );


                /*
                   ダブルタップ成立
                */

                if (
                    tapInterval <=
                        DOUBLE_TAP_TIME &&
                    tapDistance <=
                        DOUBLE_TAP_DISTANCE
                ) {

                    /*
                       90% → 200%
                    */

                    if (
                        scale <=
                        INITIAL_SCALE + 0.001
                    ) {

                        setScale(
                            DOUBLE_TAP_SCALE,
                            releasedX,
                            releasedY
                        );

                    }

                    /*
                       200%など拡大中
                       → 初期表示
                    */

                    else {

                        resetView();

                    }


                    /*
                       ダブルタップ処理後は
                       前回タップをクリア
                    */

                    lastTapTime = 0;

                }

                /*
                   まだ1回目のタップ
                */

                else {

                    lastTapTime = now;

                    lastTapX =
                        releasedX;

                    lastTapY =
                        releasedY;

                }

            }

        }

    }
);


/* =========================================================
   Pointer Cancel
========================================================= */

viewer.addEventListener(
    "pointercancel",
    function (event) {

        pointers.delete(
            event.pointerId
        );


        /*
           タップ候補をキャンセル
        */

        tapMoved = true;


        /*
           ピンチ後の状態を安全にする
        */

        if (pointers.size === 1) {

            const remaining =
                Array.from(
                    pointers.values()
                )[0];


            dragLastX =
                remaining.x;

            dragLastY =
                remaining.y;

        }

    }
);


/* =========================================================
   Distance between two pointers
========================================================= */

function distance(a, b) {

    const dx =
        b.x - a.x;

    const dy =
        b.y - a.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   Mouse wheel zoom
========================================================= */

viewer.addEventListener(
    "wheel",
    function (event) {

        /*
           ボタン上ではズームしない
        */

        if (event.target.closest("button")) {

            return;

        }


        event.preventDefault();


        let newScale;


        if (event.deltaY < 0) {

            newScale =
                scale * ZOOM_STEP;

        } else {

            newScale =
                scale / ZOOM_STEP;

        }


        setScale(
            newScale,
            event.clientX,
            event.clientY
        );

    },
    {
        passive: false
    }
);


/* =========================================================
   PC double click
========================================================= */


/*
   Pointer Eventsだけでダブルタップを処理していますが、
   PCでは通常のdblclickも明示的に処理します。

   これにより、

       PC → ダブルクリック
       iPhone → ダブルタップ

   の両方に対応します。
*/

viewer.addEventListener(
    "dblclick",
    function (event) {

        /*
           ボタン上では処理しない
        */

        if (event.target.closest("button")) {

            return;

        }


        event.preventDefault();


        if (
            scale <=
            INITIAL_SCALE + 0.001
        ) {

            setScale(
                DOUBLE_TAP_SCALE,
                event.clientX,
                event.clientY
            );

        } else {

            resetView();

        }


        /*
           Pointer Events側の
           ダブルタップ判定と二重処理しないため、
           前回タップ情報をクリア。
        */

        lastTapTime = 0;

    }
);


/* =========================================================
   Viewport / Orientation change
========================================================= */

function handleViewportChange() {

    if (!photo.naturalWidth) {

        return;

    }


    /*
       現在の倍率を維持したまま
       fitScaleだけ再計算する。
    */

    calculateFitScale();

    clampTranslation();

    updateImage();

}


/*
   通常の画面回転
*/

window.addEventListener(
    "resize",
    handleViewportChange
);


/*
   visualViewport変化

   iPhoneのアドレスバー表示／非表示にも対応
*/

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        handleViewportChange
    );

}


/* =========================================================
   Prevent context menu
========================================================= */

viewer.addEventListener(
    "contextmenu",
    function (event) {

        event.preventDefault();

    }
);


/* =========================================================
   Initial setup
========================================================= */

if (imageURL) {

    /*
       読み込み中表示
    */

    loading.style.display = "block";

}

</script>

</body>
</html>
