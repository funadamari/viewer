<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
  <title>画像Viewer</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
<main id="viewer">
  <div id="imageStage">
    <img id="image" alt="">
    <div id="title"></div>

    <div id="imageControls" aria-label="画像操作">
      <button id="zoomIn" type="button" aria-label="拡大" title="拡大">＋</button>
      <button id="zoomOut" type="button" aria-label="縮小" title="縮小">−</button>
      <button id="resetView" type="button" aria-label="リセット" title="リセット">↺</button>
      <button id="closeButton" type="button" aria-label="閉じる" title="閉じる">×</button>
    </div>
  </div>

  <div id="pageNavigation" aria-label="ページ移動">
    <button id="prevPage" type="button" aria-label="前のページ">
      ← 前へ
    </button>

    <span id="pageIndicator">1 / 6</span>

    <button id="nextPage" type="button" aria-label="次のページ">
      次へ →
    </button>
  </div>
  
  <div id="audioBar" aria-label="音声コントロール">
    <audio id="audio" preload="metadata"></audio>
    <button id="back5" type="button" aria-label="5秒戻る" title="5秒戻る">↶</button>
    <button id="play" type="button" aria-label="再生" title="再生">▶</button>
    <button id="pause" type="button" aria-label="一時停止" title="一時停止">⏸</button>
    <button id="forward5" type="button" aria-label="5秒進む" title="5秒進む">↷</button>
    <input id="progress" type="range" min="0" max="1000" value="0" aria-label="再生位置">
    <span id="time">0:00 / 0:00</span>
    <span class="volumeIcon" aria-hidden="true">🔊</span>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量">
    <select id="rate" aria-label="再生速度" title="再生速度">
      <option value="0.75">0.75×</option>
      <option value="1" selected>1.0×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="2">2.0×</option>
    </select>
  </div>
</main>
<script src="viewer.js"></script>
</body>
</html>
